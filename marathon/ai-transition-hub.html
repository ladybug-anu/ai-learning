},
{
  group:'CAREER',
  id:'relocation', title:'Relocation Track',
  lesson:`
    <p>This runs on its own timeline, independent of studying, and has long lead times — so starting early matters more than doing it perfectly.</p>
    <p><b>Two routes, usually run in parallel:</b></p>
    <ul>
      <li><b>Points-based self-migration</b> — you apply yourself, no job offer needed, get residency, then find work. Australia (189/190) and Canada (Express Entry) work this way. Slower, more paperwork, but not dependent on any employer.</li>
      <li><b>Employer sponsorship</b> — a company hires and sponsors you. Faster, but tied to that employer initially. Germany (EU Blue Card), Netherlands, Ireland, UK, and Australia 482 fit here.</li>
    </ul>
    <p><b>Destination notes for a senior software engineer:</b></p>
    <ul>
      <li><b>Australia</b> — software engineering is on the skills lists, but points-tested PR is competitive (roughly 80+ points recently). Needs an ACS skills assessment and a strong English score. English-speaking, high liveability.</li>
      <li><b>Germany</b> — large number of unfilled IT roles and a comparatively accessible Blue Card route. Growing English-speaking tech scene in Berlin and Munich.</li>
      <li><b>Canada</b> — Express Entry needs no job offer; spouse typically receives an open work permit.</li>
      <li><b>Netherlands / Ireland</b> — straightforward highly-skilled-migrant permits, strong English-speaking tech markets.</li>
      <li><b>UK</b> — Skilled Worker visa; senior backend salaries sit comfortably above the threshold.</li>
    </ul>
    <p><b>English test: required, no exemption.</b> Canada allows none at all. Australia exempts only certain passport holders — Indian citizens are not exempt regardless of English-medium schooling. More importantly it is a <i>scoring lever</i>, not just a threshold: proficient and superior bands add meaningful points, often deciding whether you are invited at all. Aim for the top band, not a pass. PTE Academic is fully computer-based and many find its format more predictable than IELTS.</p>
    <p><b>On tax:</b> most of these countries tax more than India at your income level, not less. The argument is not lower tax — it is that functioning healthcare, transport, air quality, and public services come back for it. If low tax is the priority instead, that points to Dubai or Singapore, with different lifestyle tradeoffs.</p>
  `,
  practice:[
    {q:'Book PTE Academic. This gates everything downstream and has weeks of lead time.', hint:'Target the superior band, not the minimum. Format practice matters as much as English ability.'},
    {q:'Start a skills assessment: ACS for Australia, or WES for Canada. These take weeks to months.', hint:'You cannot submit an expression of interest without one.'},
    {q:'Pick a primary and a secondary destination, and note why each — cost of living, visa route, job market for your stack.', hint:'Australia and Canada reward patience and paperwork; Germany and Netherlands reward finding an employer quickly.'},
    {q:'Run a net-income comparison for one target city: salary after tax, minus rent and living costs, versus your current position.', hint:'Compare lifestyle delivered, not the converted number.'}
  ],
  quiz:[
    {q:'Does English-medium schooling in India exempt you from a language test?', a:'No. Canada allows no exemptions; Australia exempts only certain passport holders, which does not include India'},
    {q:'Why aim for a top band rather than just passing?', a:'In points-based systems the higher bands add substantial points, often deciding whether you are invited at all'},
    {q:'What is the honest tax argument for relocating?', a:'Not lower tax — most destinations tax more. It is that functioning public services and infrastructure come back for it'}

{
  group:'ARCHITECTURE',
  id:'patterns', title:'Design Patterns (named, interview-ready)',
  lesson:`
    <p>Architecture Reps teaches you how to <i>think</i> about structure. This module gives you the <b>named patterns</b> interviewers ask about by name — "solution architect" and "technical lead" JDs list these explicitly, and at 10 years you are expected to recognise them.</p>
    <p>You do not need all 23 classic patterns. Five carry almost all interview weight, and you have already used three without knowing their names.</p>
    <p><b>1. Factory</b> — a function or class whose job is creating objects, so callers do not need to know which concrete type they get.</p>
    <pre><code>def get_storage(kind):
    if kind == "sqlite":
        return SQLiteStore()
    elif kind == "json":
        return JSONStore()

store = get_storage("sqlite")   # caller does not care which</code></pre>
    <p>You met this exact idea when weighing JSON versus SQLite for the expense tracker. A factory is what lets you swap them without touching the rest of the code.</p>
    <p><b>2. Strategy</b> — several interchangeable implementations behind one shared interface, chosen at runtime.</p>
    <pre><code>class OpenAIEmbedder:
    def embed(self, text): ...

class LocalEmbedder:
    def embed(self, text): ...

# anything that calls .embed() works with either
def build_index(chunks, embedder):
    return [embedder.embed(c) for c in chunks]</code></pre>
    <p>Directly relevant to AI work: swapping model providers, embedding backends, or vector stores is the textbook case. This is the honest answer to "how would you make this provider-agnostic?"</p>
    <p><b>3. Singleton</b> — exactly one instance exists, shared everywhere. Database connections and model clients are the usual examples. Interviewers often follow up with its downsides: it is effectively a global, which makes testing harder and hides dependencies. Knowing the criticism scores better than just naming the pattern.</p>
    <p><b>4. Observer</b> — objects subscribe to an event and get notified when it happens, without the publisher knowing who is listening. Event systems, webhooks, and logging hooks work this way.</p>
    <p><b>5. Repository</b> — a layer that isolates data access from business logic. Your calculate functions take a list of expenses; they do not know or care whether it came from SQLite, JSON, or an API. You built this pattern in the expense tracker by splitting storage from calculation.</p>
    <p><b>The two principles underneath all of them</b>, worth naming in interviews:</p>
    <ul>
      <li><b>Single responsibility</b> — one class, one job. You discovered this yourself when ExpenseTracker was trying to be both one expense and the whole system.</li>
      <li><b>Dependency inversion</b> — depend on an interface, not a concrete implementation. This is why passing an embedder into build_index beats hardcoding one inside it, and why the function stays testable.</li>
    </ul>
    <p><b>The interview trap to avoid:</b> naming patterns for their own sake. The good answer is always "I used X because Y would otherwise happen" — pattern plus justification. Applying patterns where they are not needed is a recognised anti-pattern in itself, and interviewers probe for it.</p>
  `,
  practice:[
    {q:'Refactor your rebuilt RAG system so the embedding model is passed in rather than hardcoded (Strategy). Then swap it for a different model without changing the indexing code.', hint:'Any object with an .encode() or .embed() method should work.', answer:`def build_index(chunks, embedder):
    embeddings = embedder.encode(chunks).tolist()
    ...

# now either works:
build_index(chunks, SentenceTransformer("all-MiniLM-L6-v2"))
build_index(chunks, SomeOtherEmbedder())`},

{
  group:'ARCHITECTURE',
  id:'fastapi', title:'REST APIs & FastAPI',
  lesson:`
    <p><b>The gap this closes:</b> every JD mentioning microservices, application development, or solution architecture assumes you have built web services — an endpoint another system calls over HTTP, not a script you run yourself. You have built CLI tools and a Streamlit app. You have never built an API. This is the fastest high-value gap to close.</p>
    <p><b>What a REST API actually is:</b> your code, exposed at a URL, that other programs call. They send a request; you return data, usually JSON. The vocabulary:</p>
    <ul>
      <li><b>Endpoint</b> — a URL path that does one thing: /expenses, /search</li>
      <li><b>Method</b> — GET reads, POST creates, PUT updates, DELETE removes</li>
      <li><b>Request body</b> — JSON the caller sends you</li>
      <li><b>Response</b> — JSON you send back, with a status code (200 fine, 404 not found, 500 broken) — the same codes you already read when debugging</li>
    </ul>
    <p><b>FastAPI</b> is the modern Python standard. Minimal example:</p>
    <pre><code>from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()

class Expense(BaseModel):
    amount: float
    category: str
    date: str

@app.get("/health")
def health():
    return {"status": "ok"}

@app.post("/expenses")
def add_expense(expense: Expense):
    save_to_db(expense)
    return {"saved": True, "category": expense.category}</code></pre>
    <p>Run it with <code>uvicorn main:app --reload</code>, then open <code>/docs</code> in a browser — FastAPI generates interactive API documentation automatically, which is a large part of why it is preferred.</p>
    <p><b>Pydantic</b> (the BaseModel above) is the validation layer: if a caller sends a string where a float is expected, FastAPI rejects it with a clear error before your code runs. This is the "handle bad input gracefully" requirement, solved structurally rather than with scattered try/except blocks.</p>
    <p><b>Why this matters for AI roles specifically:</b> a deployed RAG system is normally an API, not a Streamlit page. A POST /ask endpoint taking a question and returning an answer with sources is what production looks like — Streamlit is the demo layer, the API is the product. Wrapping your rebuilt RAG system in FastAPI turns it from a demo into something that reads as production engineering.</p>
    <p><b>Async connects here too:</b> your asyncio module was not academic. FastAPI endpoints can be <code>async def</code>, letting one server handle many concurrent requests while each waits on an LLM call. That is exactly the overlapping-waits case asyncio exists for.</p>
  `,
  practice:[
    {q:'Build a two-endpoint API from scratch: GET /health returning ok, and POST /echo returning whatever JSON it receives. Run it and test via /docs.', hint:'pip install fastapi uvicorn, then uvicorn main:app --reload', answer:`from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()

class Msg(BaseModel):
    text: str

@app.get("/health")
def health():
    return {"status": "ok"}

@app.post("/echo")
def echo(msg: Msg):
    return {"you_sent": msg.text}`},

{
  group:'ARCHITECTURE',
  id:'microservices', title:'Microservices & System Design Basics',
  lesson:`
    <p>Several of your target JDs name microservices and scalable systems. You do not need deep distributed-systems expertise for applied AI roles, but you must be able to hold a credible conversation. This module is the working vocabulary.</p>
    <p><b>Monolith vs microservices:</b> a monolith is one application containing everything. Microservices split it into separate small services that talk over the network — each independently deployable and scalable.</p>
    <p><b>The honest tradeoff</b>, which is what interviewers actually probe:</p>
    <ul>
      <li><b>Monolith</b>: simpler to build, test, and debug. One deployment. Everything in one place.</li>
      <li><b>Microservices</b>: teams ship independently, each service scales separately — but you inherit network failures, distributed debugging, data consistency problems, and far more operational complexity.</li>
    </ul>
    <p>The senior answer is never "microservices are better." It is "monolith until team size or scaling pressure justifies the split." Premature microservices is a well-known failure mode.</p>
    <p><b>Concepts you should be able to define:</b></p>
    <ul>
      <li><b>Load balancer</b> — distributes incoming requests across multiple copies of a service</li>
      <li><b>Horizontal vs vertical scaling</b> — more machines versus a bigger machine</li>
      <li><b>Stateless service</b> — holds no memory between requests, so any copy can serve any request. This is what makes horizontal scaling possible.</li>
      <li><b>Caching</b> — storing computed results so repeat work is avoided. In AI systems, caching embeddings or frequent query responses saves real money.</li>
      <li><b>Message queue</b> — work handed off to be processed later rather than making the caller wait. Long-running LLM jobs are a natural fit.</li>
      <li><b>Rate limiting</b> — capping how often a caller can hit your service. Essential when your backend costs money per call, as LLM APIs do.</li>
    </ul>
    <p><b>Applied to a RAG system at scale</b>, which is the version of this question you are most likely to get: document ingestion becomes a background job on a queue; embeddings are cached rather than recomputed; the vector store is a managed service, not an in-process instance; the API layer is stateless behind a load balancer; and LLM calls are rate-limited and retried with backoff. Being able to describe that shape is the bar for these JDs — not designing Twitter.</p>
    <p><b>Your genuine advantage here:</b> ten years debugging production failures means you understand what actually breaks in distributed systems, which most candidates only know theoretically. Lead with failure modes when answering — that is where your experience shows.</p>
  `,
  practice:[
    {q:'Draw your PDF reader as it would look at scale: ingestion, storage, retrieval, generation, API. Mark what is stateless and what holds state.', hint:'Ten minutes, paper. The vector store and document storage hold state; the API layer should not.'},

  ],

    {q:'What is the senior answer on monolith vs microservices?', a:'Monolith until team size or scaling pressure justifies the split; premature microservices adds complexity without benefit'},

{
  group:'ARCHITECTURE',
  id:'pandas', title:'Pandas & NumPy (weekend module)',
  lesson:`
    <p>Low priority, cheap insurance. Appears in data-flavoured Python JDs and costs a weekend, not a month. Do not let this displace architecture or cloud.</p>
    <p><b>NumPy</b> gives you fast numerical arrays. Its relevance to you is direct: embeddings are NumPy arrays. When your RAG system computes similarity between vectors, that is NumPy underneath.</p>
    <pre><code>import numpy as np

a = np.array([1, 2, 3])
b = np.array([4, 5, 6])
print(a + b)          # [5 7 9] — elementwise, no loop
print(np.dot(a, b))   # 32 — dot product, the basis of similarity</code></pre>
    <p><b>Pandas</b> is tabular data — think a spreadsheet you manipulate in code. The core object is a DataFrame.</p>
    <pre><code>import pandas as pd

df = pd.read_csv("expenses.csv")
print(df.head())                          # first rows
print(df["amount"].sum())                 # total
print(df.groupby("category")["amount"].sum())   # per-category totals</code></pre>
    <p>Notice that last line: it is your expense tracker's per-category calculation in a single expression, and it is the same operation as SQL GROUP BY. Pandas, SQL, and your hand-written dict counter are three routes to one idea — recognising that is more useful than memorising method names.</p>
    <p><b>The operations worth knowing:</b> read_csv, head, filtering with a condition (<code>df[df["amount"] > 500]</code>), groupby with an aggregation, sort_values, and merge (which is a JOIN).</p>
    <p><b>Scope discipline:</b> know these well enough to do a simple analysis and read someone else's pandas code. Anything deeper is a different career track and not what your target roles need.</p>
  `,

    {q:'Export some expense data to CSV, load it with pandas, and produce total plus per-category totals.', hint:'read_csv, then groupby("category")["amount"].sum()', answer:`import pandas as pd
df = pd.read_csv("expenses.csv")
print("Total:", df["amount"].sum())
print(df.groupby("category")["amount"].sum())`},
    {q:'Filter to only expenses above a threshold, then sort by amount descending.', hint:'Boolean indexing then sort_values with ascending=False.', answer:`big = df[df["amount"] > 500]
print(big.sort_values("amount", ascending=False))`},
    {q:'Using NumPy, compute cosine similarity between two embedding vectors by hand.', hint:'dot product divided by the product of both norms.', answer:`import numpy as np
def cosine(a, b):
    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))`}

{
  group:'FLUENCY',
  id:'expense-tracker', title:'Expense Tracker (in progress)',
  lesson:`
    <p>The practice drill for dev fluency and the professional build workflow. Currently <b>in progress</b> — walking skeleton runs, everything after that is open.</p>
    <p><b>Requirements (the original spec):</b></p>
    <ul>
      <li>Add an expense (amount + category)</li>
      <li>Persist across runs — data survives closing the program</li>
      <li>Summary: total spent, and total per category</li>
      <li>Bad input (like "abc" as an amount) handled without crashing</li>
      <li>GitHub with commits as you go, not one dump at the end</li>
      <li>At least 3 tests</li>
    </ul>

    <p><b>Decisions already made, and why</b> — these are your interview answers, keep them:</p>
    <ul>
      <li><b>SQLite over JSON</b> — the future spending-analysis idea is all filtering and grouping, which is what SQL is for; JSON would mean hand-written loops.</li>
      <li><b>User-entered dates, not auto-stamped</b> — so backdated expenses can be logged.</li>
      <li><b>Functions, not classes</b> — one store, no repeated stateful entities, so a class would add ceremony without buying anything. If it went multi-user, a User class would earn its place (each user holds independent state), plus a user_id column on the schema.</li>
      <li><b>Parameterised SQL (? placeholders)</b> — not string concatenation. Handles quoting and types correctly, and prevents SQL injection.</li>
    </ul>

    <p><b>The structural principle this drill teaches:</b> functions that ask the user for input, print to the screen, or touch a database are hard to test. Functions that take arguments and return values are trivial to test. So keep calculation logic pure — <code>calculate_total(expenses)</code> returns a number — and let separate thin functions do the talking and the saving. This is why "print total per category" got split into calculate + print.</p>

    <p><b>The professional build workflow</b> (transferable to any project, including take-home assignments):</p>
    <ol>
      <li>Read the spec twice; separate what is <i>required</i> from what is <i>your choice</i>. The choices are what interviewers ask about.</li>
      <li>Brainstorm doc: data model, function list, decisions with reasons, out-of-scope. 30-60 minutes, not a day.</li>
      <li>Repo first — first commit is scaffolding, .gitignore, README stub. Commit history that starts with planning reads as professional.</li>
      <li><b>Walking skeleton</b> — thinnest end-to-end path that runs, ugly is fine. Proves the pieces connect before investing in any of them.</li>
      <li>Then the loop: smallest next piece → make it work → test it → commit → repeat.</li>
      <li>Harden: try to break your own program. Each fix is a commit and an interview story.</li>
      <li>README last, written for a stranger — including your decisions and why.</li>
    </ol>
    <p><b>The rule underneath all of it:</b> at the end of any session, the project runs. It may do less than you want, but it never sits broken overnight.</p>

    <p><b>Current state:</b> input → create table → write → read back works, using parameterised queries. Still open: the calculate functions, printing summaries, validation, tests, README.</p>
  `,

{
  group:'ADVANCED PYTHON',
  id:'decorators', title:'Decorators',
  lesson:`
    <p>One of the most reliably asked senior Python interview topics, and it builds directly on closures — a decorator <i>is</i> a closure that wraps a function.</p>
    <p><b>What it does:</b> adds behaviour around an existing function without editing that function.</p>
    <pre><code>def log_calls(func):
    def wrapper(*args, **kwargs):
        print(f"calling {func.__name__}")
        result = func(*args, **kwargs)
        print(f"{func.__name__} finished")
        return result
    return wrapper

@log_calls
def add(a, b):
    return a + b

add(2, 3)
# calling add
# add finished</code></pre>
    <p><b>The @ syntax is pure shorthand.</b> This is the thing to say in an interview:</p>
    <pre><code>@log_calls
def add(a, b): ...

# is exactly the same as:
def add(a, b): ...
add = log_calls(add)</code></pre>
    <p>Once you see that, decorators stop being magic. <code>log_calls</code> takes a function, returns a replacement function, and the name is rebound to the replacement.</p>
    <p><b>Why *args and **kwargs matter here:</b> the wrapper must accept any arguments, because it does not know what it is wrapping. <code>*args</code> collects positional arguments into a tuple; <code>**kwargs</code> collects keyword arguments into a dict.</p>
    <p><b>The functools.wraps detail interviewers love:</b> without it, the decorated function loses its own name and docstring — <code>add.__name__</code> becomes "wrapper". Fix:</p>
    <pre><code>from functools import wraps

def log_calls(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper</code></pre>
    <p><b>Where you have already met decorators:</b> <code>@app.get("/health")</code> in FastAPI registers your function as an endpoint. <code>@pytest.fixture</code> in testing. Knowing they are ordinary closures underneath is what turns framework code from magic into something you can reason about.</p>
    <p><b>Common real uses:</b> logging, timing, retry-on-failure, caching, authentication checks, rate limiting — all cross-cutting concerns you want applied to many functions without duplicating code.</p>
  `,
  practice:[
    {q:'Write a timing decorator that prints how long the wrapped function took.', hint:'time.time() before and after the call.', answer:`import time
from functools import wraps

def timed(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        print(f"{func.__name__} took {time.time()-start:.2f}s")
        return result
    return wrapper`},
    {q:'Write a retry decorator that reruns the function up to 3 times if it raises an exception.', hint:'A loop with try/except inside the wrapper; re-raise if all attempts fail.', answer:`def retry(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        for attempt in range(3):
            try:
                return func(*args, **kwargs)
            except Exception as e:
                if attempt == 2:
                    raise
                print(f"attempt {attempt+1} failed, retrying")
    return wrapper`},
    {q:'Explain out loud, without notes, why @decorator and func = decorator(func) are the same thing.', hint:'If this is not fluent, reread the shorthand section.'},
    {q:'Add your timing decorator to the LLM call in your RAG system and observe real latency.', hint:'Directly useful — this is how latency monitoring actually gets implemented.'}
  ],
  quiz:[
    {q:'What does @my_decorator above a function actually do?', a:'It rebinds the name: func = my_decorator(func)'},
    {q:'Why does a decorator wrapper use *args and **kwargs?', a:'Because it must accept whatever arguments the wrapped function takes, without knowing them in advance'},
    {q:'What does functools.wraps preserve?', a:'The original function name, docstring, and metadata, which the wrapper would otherwise replace'}
  ],

    {label:'Real Python — primer on decorators', url:'https://realpython.com/primer-on-python-decorators/'},

{
  group:'ADVANCED PYTHON',
  id:'context-managers', title:'Context Managers',
  lesson:`
    <p>You have used these since the File I/O lesson without naming them. Any <code>with</code> statement is a context manager, and interviewers ask you to write your own.</p>
    <p><b>What they guarantee:</b> setup happens, your code runs, and cleanup happens — <i>even if your code raises an exception</i>. That guarantee is the whole point.</p>
    <pre><code>with open("notes.txt") as f:
    data = f.read()
    # file closes automatically, even if read() throws</code></pre>
    <p><b>Writing your own, the class way</b> — two methods:</p>
    <pre><code>class Timer:
    def __enter__(self):
        self.start = time.time()
        return self            # this is what "as t" receives

    def __exit__(self, exc_type, exc_val, exc_tb):
        print(f"took {time.time()-self.start:.2f}s")
        # return False (or nothing) to let exceptions propagate

with Timer() as t:
    do_slow_thing()</code></pre>
    <p><b>The shorter way, with a decorator and a generator</b> — this is where three concepts you know converge:</p>
    <pre><code>from contextlib import contextmanager

@contextmanager
def timer():
    start = time.time()
    try:
        yield                       # everything before = setup
    finally:
        print(time.time() - start)  # everything after = cleanup

with timer():
    do_slow_thing()</code></pre>
    <p>Notice what that is: a <b>decorator</b> applied to a <b>generator</b>, where <code>yield</code> marks the pause point at which your <code>with</code> block runs. Setup before the yield, cleanup after, and <code>finally</code> guarantees cleanup even on exceptions.</p>
    <p><b>Directly applicable to your expense tracker:</b> the fix for the never-closed SQLite connection is exactly this — <code>with sqlite3.connect("expenses.db") as conn:</code> handles commit and cleanup for you instead of passing conn between functions and hoping.</p>
    <p><b>The interview question:</b> "what happens if an exception occurs inside a with block?" Answer: <code>__exit__</code> still runs, receiving the exception type, value, and traceback. If it returns True the exception is suppressed; anything else lets it propagate. Suppressing silently is usually a mistake.</p>
  `,
  practice:[
    {q:'Write a context manager class that prints "entering" and "exiting", and confirm "exiting" still prints when the block raises an exception.', hint:'Raise something deliberately inside the with block.', answer:`class Noisy:
    def __enter__(self):
        print("entering")
        return self

{
  group:'ADVANCED PYTHON',
  id:'concurrency', title:'GIL, Threading vs Multiprocessing',
  lesson:`
    <p>The classic senior Python interview question, and the reason your asyncio module was only part of the picture. Expect to be asked this directly.</p>
    <p><b>The GIL (Global Interpreter Lock)</b> is a lock inside CPython that allows only one thread to execute Python bytecode at a time. Consequence: threads do <b>not</b> give you true parallel computation in Python, no matter how many CPU cores you have.</p>
    <p><b>The distinction everything hangs on:</b></p>
    <ul>
      <li><b>I/O-bound</b> — your program is waiting: network calls, API requests, disk reads, database queries. The CPU is idle.</li>
      <li><b>CPU-bound</b> — your program is computing: number crunching, image processing, large loops. The CPU is saturated.</li>
    </ul>
    <p><b>The three tools, and when each is correct:</b></p>
    <ul>
      <li><b>asyncio</b> — I/O-bound, single thread, cooperative pausing at await points. Lowest overhead, best for many concurrent network calls. This is the right tool for calling several LLM APIs at once.</li>
      <li><b>Threading</b> — also I/O-bound. The GIL is released while a thread waits on I/O, so threads do overlap usefully there. Useful with libraries that are not async-aware.</li>
      <li><b>Multiprocessing</b> — CPU-bound. Separate processes, each with its own interpreter and its own GIL, so they genuinely run in parallel across cores. Costs more memory and requires data to be serialised between processes.</li>
    </ul>
    <p><b>The one-line answer to memorise:</b> I/O-bound goes to asyncio or threads; CPU-bound goes to multiprocessing; the GIL is why threads do not help CPU-bound work.</p>
    <pre><code>from concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor

# I/O-bound: fetching many URLs
with ThreadPoolExecutor(max_workers=10) as pool:
    results = list(pool.map(fetch_url, urls))

# CPU-bound: heavy computation
with ProcessPoolExecutor() as pool:
    results = list(pool.map(crunch_numbers, datasets))</code></pre>
    <p>Note both use <code>with</code> — context managers again, handling worker cleanup.</p>
    <p><b>Applied to your work:</b> embedding a large document is CPU-bound (multiprocessing helps). Calling an LLM API for each of 50 chunks is I/O-bound (asyncio helps). Getting that distinction right in an interview signals real experience rather than memorised trivia.</p>
    <p><b>Worth knowing:</b> recent Python versions have introduced experimental free-threaded builds that remove the GIL, but the GIL remains the default behaviour and the expected interview answer. Mentioning that it is changing is a small bonus signal.</p>
  `,

{
  group:'ADVANCED PYTHON',
  id:'pythonic', title:'Comprehensions & Pythonic Idioms',
  lesson:`
    <p>Interviewers read fluency partly from idiom. Writing a Java-style loop where a comprehension belongs is a small signal that gets noticed.</p>
    <p><b>List comprehensions</b> — build a list in one expression:</p>
    <pre><code>squares = [n * n for n in numbers]
big = [n for n in numbers if n > 100]
labels = [x.upper() if x else "unknown" for x in names]</code></pre>
    <p><b>Dict and set comprehensions</b> use the same shape:</p>
    <pre><code>lengths = {word: len(word) for word in words}
unique_categories = {e["category"] for e in expenses}</code></pre>
    <p><b>Generator expressions</b> — identical syntax with parentheses, but lazy: values are produced one at a time instead of building the whole list. This connects straight to your generators module, and matters for large data.</p>
    <pre><code>total = sum(e["amount"] for e in expenses)   # no intermediate list built</code></pre>
    <p><b>When NOT to use a comprehension:</b> if it needs more than one condition plus a transformation, or spans multiple lines, a plain loop is clearer. Nested comprehensions are almost always less readable than the loop they replace. Knowing when to stop is itself a senior signal.</p>
    <p><b>Idioms interviewers notice:</b></p>
    <ul>
      <li><code>enumerate(items)</code> instead of manually tracking an index — you already use this</li>
      <li><code>zip(a, b)</code> to iterate two sequences together</li>
      <li>Unpacking: <code>a, b = b, a</code> to swap; <code>first, *rest = items</code></li>
      <li><code>dict.get(key, default)</code> instead of checking membership first — your counter pattern</li>
      <li>f-strings for formatting, never string concatenation with +</li>
      <li>Truthiness: <code>if not items:</code> rather than <code>if len(items) == 0:</code></li>
      <li><code>any()</code> and <code>all()</code> for conditions across a sequence</li>
      <li><code>collections.Counter</code> for counting, and <code>defaultdict</code> to avoid repetitive get-or-create code</li>
    </ul>
    <pre><code>from collections import Counter
counts = Counter(codes)          # your dict counter, in one line
print(counts.most_common(3))     # top three</code></pre>
    <p><b>*args and **kwargs:</b> <code>*args</code> collects extra positional arguments into a tuple; <code>**kwargs</code> collects extra keyword arguments into a dict. Essential for decorators and any wrapper function.</p>
  `,

# positional: (1, 2)

{
  group:'ADVANCED PYTHON',
  id:'typing', title:'Type Hints & Dataclasses',
  lesson:`
    <p>Expected at senior level in modern Python codebases, and the foundation of FastAPI and Pydantic, which you will use for the API module.</p>
    <p><b>Type hints</b> document what goes in and comes out. Python does not enforce them at runtime — they are for humans, editors, and static checkers like mypy.</p>
    <pre><code>def calculate_total(expenses: list[dict]) -> float:
    return sum(e["amount"] for e in expenses)

def load_pdf(path: str) -> str: ...
def chunk_text(text: str, size: int = 500) -> list[str]: ...</code></pre>
    <p>You already wrote these in your PDF reader. The value: editors autocomplete correctly, and a reader knows the contract without reading the body.</p>
    <p><b>Useful types beyond the basics:</b></p>
    <pre><code>from typing import Optional

def find(id: int) -> Optional[dict]:   # returns a dict or None
    ...

scores: dict[str, float]
pair: tuple[int, str]</code></pre>
    <p><b>Dataclasses</b> remove boilerplate from classes that mainly hold data:</p>
    <pre><code>from dataclasses import dataclass

@dataclass
class Expense:
    amount: float
    category: str
    date: str

e = Expense(250.0, "food", "2026-07-29")
print(e)   # Expense(amount=250.0, category='food', date='2026-07-29')</code></pre>
    <p>That decorator generates <code>__init__</code>, a readable <code>__repr__</code>, and equality comparison automatically. Without it you would hand-write all three. Note it is a <b>decorator</b> — the same mechanism from that module.</p>
    <p><b>Relevant to a decision you already made:</b> you chose functions over classes for the expense tracker, correctly. But if you had wanted a typed record with validation, a dataclass would have been the low-ceremony middle ground between a bare dict and a full class. Worth naming in an interview as the option you considered.</p>
    <p><b>Where this leads:</b> Pydantic models look almost identical to dataclasses but validate at runtime and raise clear errors on bad input. That is what FastAPI uses to reject malformed requests before your code runs.</p>
  `,

{
  group:'ADVANCED PYTHON',
  id:'gotchas', title:'Classic Python Gotchas',
  lesson:`
    <p>These are deliberately asked to separate people who have written real Python from people who have read about it. Each one is short and each one appears constantly.</p>
    <p><b>1. Mutable default arguments</b> — the single most asked gotcha.</p>
    <pre><code>def add_item(item, basket=[]):    # BUG
    basket.append(item)
    return basket

print(add_item("a"))   # ['a']
print(add_item("b"))   # ['a', 'b']  <-- surprise</code></pre>
    <p>The default list is created <b>once</b>, when the function is defined, and shared across every call. Fix:</p>
    <pre><code>def add_item(item, basket=None):
    if basket is None:
        basket = []
    basket.append(item)
    return basket</code></pre>
    <p><b>2. is vs ==</b> — <code>==</code> compares values; <code>is</code> compares identity (same object in memory). Use <code>is</code> only for None, True, False. Comparing numbers or strings with <code>is</code> appears to work sometimes because of interning, which makes the bug intermittent and worse.</p>
    <p><b>3. Shallow vs deep copy</b></p>
    <pre><code>import copy
original = {"tags": ["a", "b"]}
shallow = original.copy()
shallow["tags"].append("c")
print(original["tags"])   # ['a','b','c'] — inner list is shared

deep = copy.deepcopy(original)   # fully independent</code></pre>
    <p><b>4. Mutable objects passed to functions.</b> Python passes references. Mutating a list inside a function changes the caller's list; rebinding the name does not. This is exactly the bug in your PDF reader: <code>history = history[-10:]</code> rebound a local name, so the caller's list was never trimmed. That is not a small detail — it is a real defect you shipped, and understanding it now is worth more than reading about it abstractly.</p>
    <p><b>5. Late binding in closures</b></p>
    <pre><code>funcs = [lambda: i for i in range(3)]
print([f() for f in funcs])   # [2, 2, 2], not [0, 1, 2]</code></pre>
    <p>The lambdas capture the variable, not its value at creation time. Fix with a default argument: <code>lambda i=i: i</code>.</p>
    <p><b>6. Modifying a list while iterating it</b> — skips elements unpredictably. Iterate over a copy, or build a new list with a comprehension.</p>
  `,
  practice:[
    {q:'Run the mutable default argument example yourself and watch the list grow across calls.', hint:'Seeing it beats reading it.'},
    {q:'Find and fix the history-trimming bug in your PDF reader properly, then prove the fix with a test.', hint:'Either mutate in place with slice assignment, or return the new list and reassign at the call site.', answer:`# Option A: mutate in place
history[:] = history[-10:]

# Option B: return it and reassign in the caller
def trim(history):
    return history[-10:]
history = trim(history)`},
    {q:'Demonstrate shallow versus deep copy on a nested structure and explain the difference in one sentence.', hint:'copy.copy versus copy.deepcopy on a dict containing a list.'},
    {q:'Write the late-binding closure example, observe the wrong output, then fix it.', hint:'Default-argument capture: lambda i=i: i'}
  ],
  quiz:[
    {q:'Why is a mutable default argument dangerous?', a:'It is created once at function definition and shared across all calls, so state leaks between them'},
    {q:'When should you use is instead of ==?', a:'Only for None, True, and False — is compares identity, not value'},
    {q:'Why did history = history[-10:] fail to trim the caller list?', a:'It rebound the local name to a new list; the caller still referenced the original untrimmed one'}
  ],

    {label:'Official FAQ — arguments and mutability', url:'https://docs.python.org/3/faq/programming.html'}

{

  id:'project-ladder', title:'Project Ladder (Level 1 to 8)',
  lesson:`
    <p>Eight projects, ascending. <b>Each level adds exactly ONE new thing</b> to the level before it — that is the whole design. The expense tracker felt heavy because storage, structure, validation, and testing all arrived at once. This ladder separates them.</p>
    <p><b>Rules:</b> requirements only, no architecture given — that is the skill being trained. Do them in order. Do not skip to the AI levels; the fluency gap lives in levels 1 to 5. Each level should take one to three evenings, not a week.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 1 — Word Frequency Counter</h2>
    <p><i>Adds: nothing new. Pure logic, one file, no persistence.</i></p>
    <ul>
      <li>Read a text file, count how often each word appears</li>
      <li>Print the top 10 words with their counts</li>
      <li>Ignore case and strip punctuation</li>
      <li>Handle the file not existing without crashing</li>
    </ul>
    <p><b>Done when:</b> it runs, and the counting logic is a pure function you could test.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 2 — Reading List Manager</h2>
    <p><i>Adds: persistence (JSON only, no database yet).</i></p>
    <ul>
      <li>Add a book (title, author, status: to-read or read)</li>
      <li>List all books; filter by status</li>
      <li>Mark a book as read</li>
      <li>Survives restarting the program</li>
      <li>3 tests on the pure logic</li>
    </ul>
    <p><b>Done when:</b> data persists, and no test touches the filesystem.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 3 — Currency or Weather CLI</h2>
    <p><i>Adds: calling an external API.</i></p>
    <ul>
      <li>Take a city (or currency pair) as input, fetch live data from a free public API</li>
      <li>Display a clean summary, not the raw JSON</li>
      <li>Handle: no internet, bad city name, API returning an error status</li>
      <li>Cache the last result so repeated identical queries do not re-call the API</li>
    </ul>
    <p><b>Done when:</b> every failure mode you can think of produces a helpful message rather than a traceback.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 4 — Library Lending System</h2>
    <p><i>Adds: classes, design patterns, a real database. This is the architecture level.</i></p>
    <ul>
      <li>Books, members, and loans — a member borrows a book, returns it, and cannot borrow one already out</li>
      <li>SQLite, with a schema you design</li>
      <li>Storage must be swappable: the business logic should not know whether data came from SQLite or JSON (Repository pattern)</li>
      <li>Search books by title or author</li>
      <li>5+ tests, none touching the database</li>
    </ul>
    <p><b>Done when:</b> you can swap the storage layer without touching the lending rules — and you can explain out loud which patterns you used and why.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 5 — Library API</h2>
    <p><i>Adds: a web layer. Same domain as level 4, so only the API is new.</i></p>
    <ul>
      <li>Wrap level 4 in FastAPI: endpoints to list books, borrow, return, search</li>
      <li>Pydantic models for request and response bodies</li>
      <li>Correct status codes: 404 for a missing book, 400 for borrowing one already out</li>
      <li>Working interactive docs at /docs</li>
      <li>Tests hitting the endpoints, not just the logic</li>
    </ul>
    <p><b>Done when:</b> someone else could use your API from a different program, knowing nothing about your code.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 6 — Meeting Notes Summariser</h2>
    <p><i>Adds: the first LLM call. Deliberately no retrieval yet.</i></p>
    <ul>
      <li>Paste or load a block of text, get back a structured summary</li>
      <li>Output must be structured JSON: summary, action items, decisions — parsed into Python objects, not printed as loose text</li>
      <li>Handle the model returning malformed JSON without crashing</li>
      <li>Track and display tokens used and time taken per call</li>
    </ul>
    <p><b>Done when:</b> you can run it 10 times and it never crashes on a bad response.</p>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 7 — Multi-Document RAG</h2>
    <p><i>Adds: retrieval, over several documents rather than one.</i></p>
    <ul>
      <li>Index multiple documents, not just one PDF</li>
      <li>Answers must cite which document and page they came from</li>
      <li>Refuses to answer when the information is not in any document</li>

    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:15px;margin:22px 0 8px;">Level 8 — Tool-Calling Agent</h2>
    <p><i>Adds: the agent loop — the model decides what to do next.</i></p>

      <li>Handles multi-step questions requiring two or more tools in sequence</li>
      <li>Max-iteration guard so it cannot loop forever</li>
      <li>Full step logging: every reasoning step, tool call, and result</li>
      <li>Sensible behaviour when a tool fails or returns garbage</li>
    </ul>
    <p><b>Done when:</b> you can show the step trace for a two-tool question and explain each decision the model made.</p>

    <p style="margin-top:24px;"><b>Where the expense tracker fits:</b> it sits between levels 2 and 4 — persistence plus structure plus tests. Finish it if you want, but if it feels heavy, do levels 1 to 3 first and come back. Nothing is lost by reordering.</p>
    <p><b>What to keep for the portfolio:</b> levels 4, 5, 7, and 8 are CV-worthy. Levels 1, 2, 3, and 6 are drills — build them, learn from them, do not polish them.</p>

/* ================= STATE ================= */
const STORAGE_KEY = 'ai-transition-hub-state';
let state = { tasks:{}, view:'home', openPhases:{s6:true} };
let currentLesson = null;
let syncStatus = 'unknown';   // 'ok' | 'error' | 'unknown'

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY);
    if(r){ const saved = JSON.parse(r.value); state.tasks = saved.tasks || {}; }
    syncStatus = 'ok';
  }catch(e){
    // First run has no saved key yet (expected), OR storage isn't available
    // in this environment (e.g. standalone downloaded file). Either way,
    // don't block the app -- just note sync is unavailable.
    syncStatus = 'error';
  }
  render();
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({tasks:state.tasks}));
    syncStatus = 'ok';
  }catch(e){
    console.error('save failed', e);
    syncStatus = 'error';
  }
}

/* ---- Manual export / import fallback, for whenever cloud sync fails ---- */
function exportProgress(){
  const payload = JSON.stringify({tasks:state.tasks}, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'ai-transition-progress-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById('import-input').click();
}

function importProgress(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && typeof parsed.tasks === 'object'){
        state.tasks = Object.assign({}, state.tasks, parsed.tasks);
        saveState();
        render();
        alert('Progress imported successfully.');
      }else{
        alert('That file does not look like a valid progress backup.');
      }
    }catch(err){
      alert('Could not read that file. Make sure it is an exported progress JSON.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function toggleTask(key, ev){
  if(ev) ev.stopPropagation();
  state.tasks[key] = !state.tasks[key];
  saveState();
  render();
}
function togglePhase(id){
  state.openPhases[id] = !state.openPhases[id];
  render();
}
function openLesson(id, ev){
  if(ev) ev.stopPropagation();
  currentLesson = id;
  state.view = 'lesson';
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function goHome(){
  state.view = 'home';
  currentLesson = null;
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function resetAll(){
  if(confirm('Clear all checked progress?')){
    state.tasks = {};
    saveState();
    render();
  }
}

/* ================= RENDER ================= */
function render(){
  if(state.view === 'lesson' && currentLesson){ renderLesson(); }
  else{ renderHome(); }
}

function renderHome(){
  const app = document.getElementById('app');
  let totalTasks = 0, doneTasks = 0;

  const phaseHtml = PHASES.map(phase => {
    const taskHtml = phase.tasks.map((t, ti) => {
      const key = phase.id+'-'+ti;
      totalTasks++;
      const checked = !!state.tasks[key];
      if(checked) doneTasks++;
      const lessonBtn = t.lesson
        ? `<div class="lesson-link" onclick="openLesson('${t.lesson}', event)">open lesson \u2192</div>`
        : '';
      return `
        <div class="task ${checked?'done':''}">
          <div class="box ${checked?'checked':''}" onclick="toggleTask('${key}', event)"></div>
          <div class="task-text" >
            <span onclick="toggleTask('${key}', event)" style="cursor:pointer;">${t.text}</span>
            ${lessonBtn}
          </div>
        </div>`;
    }).join('');

    const phaseDone = phase.tasks.filter((_,ti)=>state.tasks[phase.id+'-'+ti]).length;
    const isOpen = !!state.openPhases[phase.id];

    return `
      <div class="phase ${isOpen?'open':''}">
        <div class="phase-head" onclick="togglePhase('${phase.id}')">
          <span class="tag">${phase.tag}</span>
          <span class="title">${phase.title}</span>
          <span class="count">${phaseDone}/${phase.tasks.length}</span>
          <span class="chev">\u25B6</span>
        </div>
        <div class="phase-body">${taskHtml}</div>
      </div>`;
  }).join('');

  const pct = totalTasks ? Math.round((doneTasks/totalTasks)*100) : 0;

  app.innerHTML = `
    <div class="eyebrow">Dell \u2192 AI Engineer</div>
    <h1>AI Transition Hub</h1>
    <div class="sub">Fluency over coverage \u00B7 applying now \u00b7 relocation track open</div>

    ${syncStatus === 'error' ? `
      <div class="sync-warn">
        \u26A0 Progress isn't syncing to your account right now. Your checks are still saved on this
        device for this session -- tap <b>export backup</b> below before closing, and
        <b>import backup</b> on your other device to bring it over.
      </div>` : ''}

    <div class="gauge-card">
      <div class="gauge-labels">
        <span class="now">\u20B930L now</span>
        <span class="target">\u20B975L / relocation</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" style="width:${pct}%"></div>
      </div>
      <div class="gauge-foot">
        <span>Progress toward target</span>
        <span><b>${pct}%</b> of plan complete</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">${doneTasks}/${totalTasks}</div><div class="l">Tasks done</div></div>
      <div class="stat"><div class="n">${PHASES.length}</div><div class="l">Phases</div></div>
      <div class="stat"><div class="n">2x</div><div class="l">Min. to move</div></div>
    </div>

    ${phaseHtml}

    <div class="backup-row">
      <button class="backup-btn" onclick="exportProgress()">\u2913 export backup</button>
      <button class="backup-btn" onclick="triggerImport()">\u2912 import backup</button>
    </div>
    <input type="file" id="import-input" accept="application/json" style="display:none" onchange="importProgress(event)">

    <button class="reset" onclick="resetAll()">reset all progress</button>
  `;
}

function renderLesson(){
  const m = MODULES.find(x=>x.id===currentLesson);
  if(!m){ goHome(); return; }
  const idx = MODULES.findIndex(x=>x.id===currentLesson);
  const prev = MODULES[idx-1];
  const next = MODULES[idx+1];

  const practiceHtml = m.practice.map(p=>`
    <div class="practice-item">
      <div>${p.q}</div>
      ${p.hint? `<details><summary>hint</summary><div class="hint-box">${p.hint}</div></details>`:''}
      ${p.answer? `<details><summary>show answer</summary><div class="answer-box"><pre><code>${p.answer}</code></pre></div></details>`:''}
    </div>
  `).join('');

  const quizHtml = m.quiz.map(q=>`
    <div class="quiz-block">
      <div class="quiz-q">${q.q}</div>
      <details><summary>reveal answer</summary><div class="answer-box">${q.a}</div></details>
    </div>
  `).join('');

  const linksHtml = m.links.map(l=>`
    <a class="link-item" href="${l.url}" target="_blank" rel="noopener">
      <span>${l.label}</span><span class="arrow">open \u2197</span>
    </a>
  `).join('');

  document.getElementById('app').innerHTML = `
    <button class="back" onclick="goHome()">\u2190 back to tracker</button>
    <div class="eyebrow">${m.group}</div>
    <h1>${m.title}</h1>
    <div class="sub">Lesson ${idx+1} of ${MODULES.length}</div>

    <h2>Lesson</h2>
    ${m.lesson}

    <h2>Practice</h2>
    <div class="card">${practiceHtml}</div>

    <h2>Quiz</h2>
    <div class="card">${quizHtml}</div>

    <h2>Go deeper</h2>
    <div class="links">${linksHtml}</div>

    <div class="module-nav-btns">
      ${prev? `<button class="nb" onclick="openLesson('${prev.id}')">\u2190 ${prev.title}</button>` : '<span></span>'}
      ${next? `<button class="nb" onclick="openLesson('${next.id}')">${next.title} \u2192</button>` : '<span></span>'}
    </div>
  `;
}

loadState();
</script>
</body>
</html>
