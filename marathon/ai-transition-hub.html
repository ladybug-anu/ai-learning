<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Transition Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#12161d; --surface:#1a212b; --surface-2:#212a36; --line:#2a3441;
    --text:#e7eaee; --muted:#8b95a3; --amber:#f2a93b; --amber-dim:#7a5a24;
    --green:#4ade80;
    --font-disp:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:60px;}
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 20px;}

  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  h1{font-family:var(--font-disp);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}

  .back{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:12px;color:var(--muted);
    background:none;border:1px solid var(--line);padding:7px 13px;border-radius:8px;
    cursor:pointer;margin-bottom:20px;
  }
  .back:hover{color:var(--text);border-color:var(--amber-dim);}

  /* Gauge */
  .gauge-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:16px;}
  .gauge-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:8px;}
  .gauge-labels .now{color:var(--text);font-weight:500;}
  .gauge-labels .target{color:var(--amber);font-weight:500;}
  .gauge-track{position:relative;height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .gauge-fill{height:100%;background:linear-gradient(90deg,#c98a2e,var(--amber));border-radius:8px 0 0 8px;transition:width .5s ease;position:relative;}
  .gauge-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:#fff;opacity:.6;}
  .gauge-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);}
  .gauge-foot b{color:var(--green);font-weight:600;}

  .stats{display:flex;gap:10px;margin-bottom:22px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat .n{font-family:var(--font-disp);font-size:20px;font-weight:700;}
  .stat .l{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

  /* Phases */
  .phase{margin-bottom:14px;}
  .phase-head{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    cursor:pointer;user-select:none;
  }
  .phase-head .tag{font-family:var(--font-mono);font-size:11px;color:var(--amber);background:rgba(242,169,59,0.1);border:1px solid var(--amber-dim);padding:2px 8px;border-radius:6px;white-space:nowrap;}
  .phase-head .title{font-family:var(--font-disp);font-weight:700;font-size:15px;flex:1;}
  .phase-head .count{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .phase-head .chev{color:var(--muted);transition:transform .25s;font-size:12px;}
  .phase.open .chev{transform:rotate(90deg);}
  .phase-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .phase.open .phase-body{max-height:1200px;}

  .task{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 12px 20px;border-left:1px solid var(--line);margin-left:24px;}
  .task:last-child{padding-bottom:16px;}
  .box{
    width:19px;height:19px;border-radius:5px;border:1.5px solid var(--muted);
    flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.15s;
  }
  .box.checked{background:var(--green);border-color:var(--green);}
  .box.checked::after{content:'\2713';font-size:12px;color:#0d1410;font-weight:700;}
  .task-text{font-size:13.5px;line-height:1.5;flex:1;}
  .task.done .task-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .lesson-link{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--font-mono);font-size:11px;color:var(--amber);
    background:rgba(242,169,59,0.08);border:1px solid var(--amber-dim);
    padding:3px 9px;border-radius:6px;cursor:pointer;
    margin-top:6px;user-select:none;
  }
  .lesson-link:hover{background:rgba(242,169,59,0.16);}

  .sync-warn{
    background:rgba(248,113,113,0.08);border:1px solid #7a3030;
    color:#f3b7b7;font-size:12.5px;line-height:1.5;
    padding:12px 14px;border-radius:10px;margin-bottom:18px;
  }
  .sync-warn b{color:#fff;}

  .backup-row{display:flex;gap:10px;margin-top:22px;}
  .backup-btn{
    flex:1;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-family:var(--font-mono);font-size:11.5px;
    padding:10px 12px;border-radius:9px;cursor:pointer;letter-spacing:.02em;
  }
  .backup-btn:hover{border-color:var(--amber-dim);}

  .reset{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--font-mono);font-size:11px;padding:8px 14px;border-radius:8px;cursor:pointer;letter-spacing:.04em;}
  .loading{color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:20px;text-align:center;}

  /* Lesson page */
  h2{font-family:var(--font-disp);font-weight:700;font-size:16px;margin:26px 0 10px;}
  p{font-size:14px;line-height:1.65;color:#cdd3db;margin:0 0 12px;}
  ul,ol{font-size:14px;line-height:1.65;color:#cdd3db;padding-left:20px;margin:0 0 12px;}
  li{margin-bottom:4px;}
  code{font-family:var(--font-mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12.5px;color:var(--amber);}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0 0 14px;}
  pre code{background:none;padding:0;color:#c9d1d9;font-size:12.5px;line-height:1.6;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;}
  .practice-item{margin-bottom:10px;}
  details{margin-top:6px;}
  summary{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;}
  details[open] summary{color:var(--amber);}
  .hint-box,.answer-box{margin-top:8px;padding:10px 12px;background:var(--surface-2);border-radius:8px;border-left:2px solid var(--amber-dim);font-size:13px;color:#cdd3db;}
  .answer-box{border-left-color:var(--green);}
  .answer-box pre{margin-top:8px;margin-bottom:0;}
  .quiz-q{font-weight:500;font-size:13.5px;margin-bottom:6px;color:var(--text);}
  .quiz-block{margin-bottom:16px;}
  .links{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .link-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:13px;text-decoration:none;color:var(--text);border:1px solid var(--line);}
  .link-item:hover{border-color:var(--amber-dim);}
  .link-item .arrow{color:var(--amber);font-family:var(--font-mono);font-size:12px;}
  .module-nav-btns{display:flex;justify-content:space-between;margin-top:30px;gap:10px;}
  .nb{font-family:var(--font-mono);font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;}
  .nb:hover{color:var(--text);border-color:var(--amber-dim);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">loading&hellip;</div>
</div>

<script>
/* ================= LESSON MODULES ================= */
const MODULES = [
{
  group:'PYTHON FOUNDATIONS',
  id:'variables', title:'Variables & Data Types',
  lesson:`
    <p>A <b>variable</b> is just a labeled box that holds a value. You give it a name, put something inside, and Python remembers it.</p>
    <pre><code>name = "Anu"
age = 32
is_learning = True</code></pre>
    <p>Python has a few core data types you'll use constantly:</p>
    <ul>
      <li><code>str</code> — text, always in quotes: <code>"hello"</code></li>
      <li><code>int</code> — whole numbers: <code>42</code></li>
      <li><code>float</code> — decimal numbers: <code>3.14</code></li>
      <li><code>bool</code> — <code>True</code> or <code>False</code></li>
      <li><code>list</code> — an ordered collection: <code>[1, 2, 3]</code></li>
      <li><code>dict</code> — key-value pairs: <code>{"name": "Anu", "role": "engineer"}</code></li>
    </ul>
    <p>You can check any variable's type with <code>type(variable_name)</code>. Get comfortable doing this — it's the fastest way to debug "why isn't this working" confusion.</p>
  `,
  practice:[
    {q:'Create a variable `city` with your city name, and print its type.', hint:'Use type(city) inside print().', answer:`city = "Bangalore"
print(type(city))   # <class 'str'>`},
    {q:'Create a list `skills` with 3 of your skills, then print the second item.', hint:'Lists are indexed starting at 0.', answer:`skills = ["troubleshooting", "RCA", "Python"]
print(skills[1])   # RCA`},
    {q:'Create a dict `profile` with keys "name" and "years_exp", then print just the years.', hint:'Access dict values with profile["key"].', answer:`profile = {"name": "Anu", "years_exp": 10}
print(profile["years_exp"])   # 10`}
  ],
  quiz:[
    {q:'What data type would you use to store True/False?', a:'bool'},
    {q:'How do you check the type of a variable called x?', a:'type(x)'},
    {q:'What symbol separates a key from its value in a dict?', a:'A colon ( : ), e.g. {"key": "value"}'}
  ],
  links:[
    {label:'Official Python tutorial — data types', url:'https://docs.python.org/3/tutorial/introduction.html'},
    {label:'Real Python — variables explained', url:'https://realpython.com/python-variables/'}
  ]
},
{
  group:'PYTHON FOUNDATIONS',
  id:'functions', title:'Functions',
  lesson:`
    <p>A function is a small machine: feed it <b>input</b> (called a parameter), it does a fixed job, and hands you back an <b>output</b> (called the return value). Build once, reuse forever.</p>
    <pre><code>def greet(name):
    message = "Hello, " + name
    return message

result = greet("Anu")
print(result)   # Hello, Anu</code></pre>
    <p><code>def</code> defines it. The stuff in parentheses is what it expects as input. <code>return</code> is what it hands back — without it, the function runs but gives you <code>None</code>.</p>
    <p>Why this matters for you: every troubleshooting step — "check this condition, then do that action" — is a function shape. A function that takes an error code and returns what it means is an automated RCA.</p>
  `,
  practice:[
    {q:'Write `double(n)` that returns a number multiplied by 2.', hint:'One line inside: return n * 2', answer:`def double(n):
    return n * 2

print(double(5))   # 10`},
    {q:'Write `is_even(n)` that returns True if a number is even.', hint:'Use the modulo operator %, which gives the remainder.', answer:`def is_even(n):
    return n % 2 == 0

print(is_even(4))   # True`},
    {q:'Write `full_name(first, last)` joining two strings with a space.', hint:'Use + to join strings, with " " in between.', answer:`def full_name(first, last):
    return first + " " + last

print(full_name("Anu", "K"))   # Anu K`}
  ],
  quiz:[
    {q:'What keyword starts a function definition?', a:'def'},
    {q:'What\'s the difference between a parameter and an argument?', a:'A parameter is the placeholder name in the function definition; an argument is the actual value you pass in when calling it.'},
    {q:'What does a function return if it has no return statement?', a:'None'}
  ],
  links:[
    {label:'Official Python docs — defining functions', url:'https://docs.python.org/3/tutorial/controlflow.html#defining-functions'},
    {label:'Real Python — functions guide', url:'https://realpython.com/defining-your-own-python-function/'}
  ]
},
{
  group:'PYTHON FOUNDATIONS',
  id:'errors', title:'Error Handling',
  lesson:`
    <p>This is the part that should feel like home — it's the same instinct as production troubleshooting, just written in code.</p>
    <p>When something goes wrong, Python "throws" an <b>exception</b>. If you don't catch it, your program crashes. <code>try/except</code> lets you catch it and decide what happens instead.</p>
    <pre><code>try:
    result = 10 / 0
except ZeroDivisionError:
    print("Can't divide by zero")
</code></pre>
    <p>You can catch specific error types (better practice) or a general one:</p>
    <pre><code>try:
    value = int(user_input)
except ValueError:
    print("That wasn't a valid number")
except Exception as e:
    print(f"Something else broke: {e}")
</code></pre>
    <p>Think of <code>except ValueError</code> as a specific known failure mode (like a known bug pattern), and <code>except Exception</code> as your catch-all — same as escalation triage: known issue vs "needs deeper RCA."</p>
  `,
  practice:[
    {q:'Write code that tries to convert the string "abc" to an int, and prints a friendly message if it fails.', hint:'Use try/except ValueError.', answer:`try:
    num = int("abc")
except ValueError:
    print("That's not a valid number")`},
    {q:'Write a function `safe_divide(a, b)` that returns the division result, or "Error: divide by zero" if b is 0.', hint:'Use try/except ZeroDivisionError.', answer:`def safe_divide(a, b):
    try:
        return a / b
    except ZeroDivisionError:
        return "Error: divide by zero"

print(safe_divide(10, 0))`},
    {q:'Modify the function above to also print what type of error occurred, using `except Exception as e`.', hint:'You can print(e) to see the error message.', answer:`def safe_divide(a, b):
    try:
        return a / b
    except Exception as e:
        return f"Error: {e}"`}
  ],
  quiz:[
    {q:'What block do you use to "catch" an error so your program doesn\'t crash?', a:'try/except'},
    {q:'What error type is raised when you divide by zero?', a:'ZeroDivisionError'},
    {q:'How do you catch any error and see its message?', a:'except Exception as e: then use str(e) or f"{e}"'}
  ],
  links:[
    {label:'Official docs — errors and exceptions', url:'https://docs.python.org/3/tutorial/errors.html'},
    {label:'Real Python — exception handling', url:'https://realpython.com/python-exceptions/'}
  ]
},
{
  group:'PYTHON FOUNDATIONS',
  id:'fileio', title:'File I/O',
  lesson:`
    <p>File I/O means reading from and writing to files — logs, configs, data exports. You'll use this constantly once you start building real tools.</p>
    <pre><code># Writing to a file
with open("notes.txt", "w") as f:
    f.write("First line\\n")
    f.write("Second line\\n")

# Reading a file
with open("notes.txt", "r") as f:
    content = f.read()
    print(content)</code></pre>
    <p><code>with open(...) as f</code> is the standard pattern — it automatically closes the file when you're done, even if something errors out. Always use this pattern rather than opening files manually.</p>
    <p><code>"w"</code> mode overwrites the file. <code>"a"</code> mode appends to the end without erasing existing content. <code>"r"</code> mode reads.</p>
  `,
  practice:[
    {q:'Write code that creates a file "log.txt" and writes "Task started" to it.', hint:'Use mode "w".', answer:`with open("log.txt", "w") as f:
    f.write("Task started\\n")`},
    {q:'Write code that appends "Task completed" to that same file without erasing the first line.', hint:'Use mode "a" for append.', answer:`with open("log.txt", "a") as f:
    f.write("Task completed\\n")`},
    {q:'Write code that reads log.txt and prints each line separately.', hint:'Use f.readlines() or loop over f directly.', answer:`with open("log.txt", "r") as f:
    for line in f:
        print(line.strip())`}
  ],
  quiz:[
    {q:'What does mode "a" do differently from mode "w"?', a:'"a" appends to the end of the file; "w" overwrites the whole file'},
    {q:'Why use `with open(...) as f` instead of open() directly?', a:'It automatically closes the file, even if an error happens'},
    {q:'What mode do you use to just read a file?', a:'"r"'}
  ],
  links:[
    {label:'Official docs — reading and writing files', url:'https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files'},
    {label:'Real Python — file I/O guide', url:'https://realpython.com/read-write-files-python/'}
  ]
},
{
  group:'PYTHON FOUNDATIONS',
  id:'apis', title:'APIs & JSON',
  lesson:`
    <p>An <b>API</b> is how one program asks another program for data — this is how your future AI projects will talk to models, databases, and services.</p>
    <p><b>JSON</b> is just a text format for structured data, and it looks almost exactly like a Python dict:</p>
    <pre><code>{
  "name": "Anu",
  "role": "engineer",
  "skills": ["Python", "RCA"]
}</code></pre>
    <p>To call an API from Python, you use the <code>requests</code> library:</p>
    <pre><code>import requests

response = requests.get("https://api.example.com/data")
data = response.json()   # turns JSON into a Python dict
print(data["name"])</code></pre>
    <p><code>response.status_code</code> tells you if it worked — <code>200</code> means success, <code>404</code> means not found, <code>500</code> means the server broke. This will feel familiar: it's the same triage instinct as reading an error log.</p>
  `,
  practice:[
    {q:'Write code to GET data from "https://api.github.com" and print the status code.', hint:'Use requests.get(url).status_code', answer:`import requests

response = requests.get("https://api.github.com")
print(response.status_code)`},
    {q:'From that same response, convert it to JSON and print just one key from it (e.g. "current_user_url").', hint:'Use response.json() then bracket access.', answer:`import requests

response = requests.get("https://api.github.com")
data = response.json()
print(data["current_user_url"])`},
    {q:'Write a dict representing a support ticket (id, issue, status), then print it as JSON text using the json module.', hint:'Use json.dumps(your_dict)', answer:`import json

ticket = {"id": 101, "issue": "login failure", "status": "open"}
print(json.dumps(ticket, indent=2))`}
  ],
  quiz:[
    {q:'What Python library is most commonly used to call APIs?', a:'requests'},
    {q:'What does status_code 200 mean?', a:'The request succeeded'},
    {q:'How do you turn an API response into a Python dict?', a:'response.json()'}
  ],
  links:[
    {label:'Requests library — quickstart', url:'https://requests.readthedocs.io/en/latest/user/quickstart/'},
    {label:'Real Python — working with JSON', url:'https://realpython.com/python-json/'}
  ]
},
{
  group:'AI FUNDAMENTALS',
  id:'llm', title:'LLM Basics',
  lesson:`
    <p>An <b>LLM</b> (Large Language Model) is a model trained on huge amounts of text to predict what word comes next, given everything before it. That's the entire mechanism underneath ChatGPT, Claude, and every "AI chat" product.</p>
    <p>Key vocabulary you need cold:</p>
    <ul>
      <li><b>Token</b> — a chunk of text (roughly ¾ of a word). Models process text as tokens, not full words.</li>
      <li><b>Prompt</b> — the input text you give the model.</li>
      <li><b>Context window</b> — the maximum amount of text (in tokens) a model can "see" at once, including your prompt and its own output.</li>
      <li><b>Temperature</b> — a setting controlling randomness. Low = predictable, focused. High = more creative, less consistent.</li>
      <li><b>Hallucination</b> — when a model confidently states something false, because it's predicting plausible text, not looking up facts.</li>
    </ul>
    <p>The critical mental model: an LLM doesn't "know" things the way a database does. It generates the statistically likely next token. That's exactly why RAG (next module) exists — to ground it in real data.</p>
  `,
  practice:[
    {q:'In your own words, explain to a non-technical colleague what a "hallucination" is.', hint:'Focus on: the model is guessing plausible text, not checking facts.'},
    {q:'Look at any AI chat tool\'s settings — find where "temperature" or a similar creativity control might live (some tools hide this in developer/API settings).', hint:'Not all consumer apps expose it — that\'s a valid finding too.'},
    {q:'Write down 3 tasks at Dell where an LLM could plausibly help, and 1 where it clearly should not (due to hallucination risk).', hint:'Think about tasks needing precise facts vs. tasks needing drafting/summarizing.'}
  ],
  quiz:[
    {q:'What does an LLM actually predict, token by token?', a:'The next most statistically likely token, given everything before it'},
    {q:'What is a "context window"?', a:'The max amount of text (tokens) a model can process at once, input + output combined'},
    {q:'Why do LLMs hallucinate?', a:'Because they generate plausible-sounding text based on patterns, not by looking up verified facts'}
  ],
  links:[
    {label:'Anthropic — intro to large language models', url:'https://www.anthropic.com/research'},
    {label:'Illustrated guide to how LLMs work (Jay Alammar)', url:'https://jalammar.github.io/illustrated-transformer/'}
  ]
},
{
  group:'AI FUNDAMENTALS',
  id:'rag', title:'RAG Fundamentals',
  lesson:`
    <p><b>RAG</b> stands for Retrieval-Augmented Generation. In plain terms: instead of relying only on what the model "remembers" from training, you give it real, current documents to read before it answers.</p>
    <p>The flow looks like this:</p>
    <ol>
      <li>User asks a question.</li>
      <li>Your system searches a document store (company docs, past tickets, wikis) for the most relevant chunks.</li>
      <li>Those chunks get inserted into the prompt, alongside the question.</li>
      <li>The model answers <i>using that retrieved content</i>, instead of guessing from training data.</li>
    </ol>
    <p>This is exactly the fix for your team's "tribal knowledge in people's heads" problem: if 20 years of RCAs were turned into a searchable document store, a RAG system could answer "why did this error happen" using the team's actual accumulated knowledge — this is very close to the portfolio project you're planning to build.</p>
    <p>Key term: <b>embedding</b> — a way of converting text into numbers so a computer can measure how "similar" two pieces of text are, which is how the retrieval step finds relevant chunks.</p>
  `,
  practice:[
    {q:'In your own words, explain why RAG reduces hallucination compared to a plain LLM.', hint:'The model answers from real retrieved text, not just memory.'},
    {q:'List 3 real data sources at Dell that could become a RAG knowledge base for your team\'s escalations.', hint:'Think tickets, internal wikis, past RCA emails.'},
    {q:'Sketch (on paper or in words) the 4-step RAG flow using your own troubleshooting process as the example.', hint:'Map: question → search past tickets → retrieve similar case → answer using it.'}
  ],
  quiz:[
    {q:'What does RAG stand for?', a:'Retrieval-Augmented Generation'},
    {q:'What problem does RAG solve?', a:'It grounds the model\'s answers in real, retrieved documents instead of relying purely on training memory, reducing hallucination'},

      <li><b>Guardrails</b> — checks that catch bad outputs (harmful, off-topic, hallucinated) before they reach a user.</li>
      <li><b>Cost/latency tradeoffs</b> — bigger models are smarter but slower and pricier; part of the job is picking the right model for each task.</li>

{
  group:'DEVELOPER CORE',
  id:'oop', title:'Object-Oriented Programming',
  lesson:`
    <p><b>OOP</b> is how real codebases are organized. Instead of loose functions everywhere, related data and behavior are bundled into <b>classes</b>. Interviewers at product companies will expect you to read and write class-based code comfortably.</p>
    <p>A <b>class</b> is a blueprint; an <b>object</b> is a thing built from that blueprint:</p>
    <pre><code>class Ticket:
    def __init__(self, ticket_id, issue):
        self.ticket_id = ticket_id
        self.issue = issue
        self.status = "open"

    def close(self):
        self.status = "closed"

t = Ticket(101, "login failure")   # create an object
t.close()
print(t.status)   # closed</code></pre>
    <ul>
      <li><code>__init__</code> — runs when the object is created; sets up its data</li>
      <li><code>self</code> — refers to this specific object (ticket 101, not tickets in general)</li>
      <li><b>Method</b> — a function that lives inside a class (like <code>close</code>)</li>
    </ul>
    <p><b>Inheritance</b> lets one class build on another — a <code>UrgentTicket</code> can inherit everything from <code>Ticket</code> and add its own behavior. You will see this constantly when reading real codebases.</p>
  `,

        self.status = "up"

s = Server("prod-db-01")

print(s.status)   # down`},
    {q:'Add a method restart() to Server that sets status back to "up" and prints a message.', hint:'Methods can do multiple things: change state and print.', answer:`    def restart(self):

{
  group:'DEVELOPER CORE',
  id:'dsa', title:'Data Structures Essentials',
  lesson:`
    <p>Interviews test whether you can pick the right structure for the job. You do not need competitive-programming depth for AI engineering roles, but you must be fluent in these four and their tradeoffs:</p>
    <ul>
      <li><b>List</b> — ordered, allows duplicates. Fast to loop over. Slow to search (must check each item).</li>
      <li><b>Dict</b> — key to value lookup. Near-instant search by key. This is the answer to most "make it faster" interview follow-ups.</li>
      <li><b>Set</b> — unordered, no duplicates. Near-instant membership check: <code>x in my_set</code>.</li>
      <li><b>Tuple</b> — like a list, but unchangeable. Used for fixed groups like coordinates or (status, code) pairs.</li>
    </ul>
    <p>The one concept interviewers care about: <b>time complexity</b> — how work grows with input size. Rough shorthand:</p>
    <ul>
      <li>Searching a list of n items: up to n checks — written O(n)</li>
      <li>Looking up a dict key: about 1 step regardless of size — written O(1)</li>
    </ul>
    <p>So "I looped through a list inside another loop" is O(n\u00B2) — fine for 100 items, disaster for a million. Converting an inner list-search to a dict or set lookup is the single most common optimization asked in interviews.</p>
  `,
  practice:[
    {q:'Given a list of 10 error codes with duplicates, produce a list of unique codes.', hint:'Convert to a set, then back to a list.', answer:`codes = [500, 404, 500, 403, 404, 500, 200, 301, 403, 500]
unique = list(set(codes))
print(unique)`},
    {q:'Count how many times each error code appears, using a dict.', hint:'Loop through, use the code as key, increment the value.', answer:`counts = {}
for c in codes:
    counts[c] = counts.get(c, 0) + 1
print(counts)   # {500: 4, 404: 2, ...}`},
    {q:'You have a list of 1 million user IDs and need to check if a specific ID exists, thousands of times. What structure should the IDs be in, and why?', hint:'Think O(n) vs O(1) membership check.', answer:`# A set. Checking "x in my_set" is O(1),
# while "x in my_list" is O(n) — scanning
# a million items every single check.
id_set = set(user_ids)
if 12345 in id_set: ...`}
  ],
  quiz:[
    {q:'Which structure gives near-instant lookup by key?', a:'Dict'},
    {q:'What does O(n) mean in plain words?', a:'The work grows in direct proportion to the input size — twice the items, twice the work'},
    {q:'What is the classic fix for a slow search inside a loop?', a:'Replace the list search with a dict or set lookup (O(n) becomes O(1))'}
  ],
  links:[
    {label:'Real Python — common data structures', url:'https://realpython.com/python-data-structures/'},
    {label:'NeetCode — practice problems (start with Easy)', url:'https://neetcode.io/practice'}
  ]
},
{

  id:'testing', title:'Testing Basics',
  lesson:`
    <p>Developers prove their code works with <b>automated tests</b> — small programs that run your functions with known inputs and check the outputs. This is different from QA testing a product; this is a developer writing safety nets for their own code, and product companies expect it.</p>
    <p>The standard Python tool is <b>pytest</b>. A test is just a function whose name starts with <code>test_</code>, using <code>assert</code> to check expectations:</p>
    <pre><code># file: calc.py
def double(n):
    return n * 2

# file: test_calc.py
from calc import double

def test_double_positive():
    assert double(5) == 10

def test_double_zero():
    assert double(0) == 0</code></pre>
    <p>Run all tests with one command: <code>pytest</code>. Green means safe; red shows you exactly which expectation broke.</p>
    <p>Why recruiters care: tests in your GitHub projects signal you write production-grade code, not scripts. Even 5 tests per project changes how your portfolio reads.</p>
  `,

{

  id:'sql', title:'SQL Essentials',
  lesson:`
    <p><b>SQL</b> is the language for talking to databases. Nearly every application stores data in one, and AI systems are no exception — your RAG project will store documents and metadata somewhere queryable. Interviewers routinely include one SQL question even for AI roles.</p>
    <p>The four queries that cover 90% of real usage:</p>
    <pre><code>-- Read rows
SELECT name, status FROM tickets WHERE status = 'open';

-- Add a row
INSERT INTO tickets (name, status) VALUES ('login bug', 'open');

-- Change rows
UPDATE tickets SET status = 'closed' WHERE id = 101;

-- Remove rows
DELETE FROM tickets WHERE status = 'closed';</code></pre>
    <p>Two more that interviews love:</p>
    <pre><code>-- Count / group
SELECT status, COUNT(*) FROM tickets GROUP BY status;

-- Combine two tables
SELECT t.name, u.email
FROM tickets t
JOIN users u ON t.user_id = u.id;</code></pre>
    <p><b>JOIN</b> is the one to internalize: it stitches rows from two tables together using a shared key — like matching a ticket to the user who raised it.</p>

{

  lesson:`
    <p><b>Docker</b> packages your application plus everything it needs (Python version, libraries, configs) into a portable box called a <b>container</b>, so it runs identically on your laptop, a colleague's machine, or a cloud server. "It works on my machine" stops being a problem.</p>
    <p>Key vocabulary:</p>

    <p>A minimal Dockerfile for a Python app:</p>
    <pre><code>FROM python:3.11
WORKDIR /app
COPY requirements.txt .

    <p>Build and run:</p>
    <pre><code>docker build -t my-app .
docker run my-app</code></pre>
    <p>Why this matters for you: "deployed" is what separates a script from a project. A portfolio project running in Docker — or better, live on a free host like Render or Hugging Face Spaces — is proof you can ship, not just write. LLMOps roles treat Docker fluency as assumed knowledge.</p>

{
  group:'INTERVIEW DSA',
  id:'dsa-arrays', title:'Arrays & Hashing Patterns',
  lesson:`
    <p>DSA interviews are not about knowing exotic algorithms — 70% of screening questions are solved by a handful of repeating <b>patterns</b>. This section teaches you the patterns, not competitive programming. You already know the building blocks (lists, dicts, sets); now you learn when to reach for each.</p>
    <p><b>Pattern 1 — "Have I seen this before?" \u2192 use a set.</b></p>
    <p>Problem: does a list contain any duplicates?</p>
    <pre><code>def has_duplicate(nums):
    seen = set()
    for n in nums:
        if n in seen:
            return True
        seen.add(n)
    return False</code></pre>
    <p>Loop once, remember what you have seen, check membership in O(1). This exact shape solves an entire family of problems.</p>
    <p><b>Pattern 2 — "Count things" \u2192 use a dict.</b> You already know this one — it is the counter pattern from Data Structures Essentials. Problems like "are these two words anagrams?" are just counting letters in both and comparing the two dicts.</p>
    <p><b>Pattern 3 — "Find a pair that adds to X" \u2192 dict of what you still need.</b></p>
    <p>The most famous interview question in existence (Two Sum): find two numbers that add up to a target.</p>
    <pre><code>def two_sum(nums, target):
    needed = {}   # value we need -> index of who needs it
    for i, n in enumerate(nums):
        if n in needed:
            return [needed[n], i]
        needed[target - n] = i</code></pre>
    <p>Walk through it with nums=[2,7,11], target=9: at 2, you note "I need a 7" — at 7, someone needed you — done. One pass, no nested loops.</p>
    <p><b>The meta-skill:</b> when you see a problem, ask "is this a seen-before problem, a counting problem, or a what-do-I-still-need problem?" That question alone solves most easy-level interview questions.</p>
  `,
  practice:[
    {q:'NeetCode: solve "Contains Duplicate" (Easy) yourself before peeking — it is Pattern 1 verbatim.', hint:'Set, one pass.', answer:`def containsDuplicate(nums):
    seen = set()
    for n in nums:
        if n in seen:
            return True
        seen.add(n)
    return False`},
    {q:'NeetCode: solve "Valid Anagram" (Easy) — it is Pattern 2.', hint:'Count letters of both strings into two dicts, compare.', answer:`def isAnagram(s, t):
    if len(s) != len(t):
        return False
    count_s, count_t = {}, {}
    for i in range(len(s)):
        count_s[s[i]] = count_s.get(s[i], 0) + 1
        count_t[t[i]] = count_t.get(t[i], 0) + 1
    return count_s == count_t`},
    {q:'NeetCode: solve "Two Sum" (Easy) — Pattern 3. Trace it by hand on paper first with a small example.', hint:'Dict mapping needed-value to index.', answer:`def twoSum(nums, target):
    needed = {}
    for i, n in enumerate(nums):
        if n in needed:
            return [needed[n], i]
        needed[target - n] = i`}
  ],
  quiz:[
    {q:'Which structure answers "have I seen this before?" in O(1)?', a:'A set'},
    {q:'Why is the dict approach to Two Sum better than checking every pair with nested loops?', a:'Nested loops are O(n\u00B2); the dict approach is one pass, O(n)'},
    {q:'What question should you ask yourself first when seeing a new array problem?', a:'Is this a seen-before problem, a counting problem, or a what-do-I-still-need problem?'}
  ],
  links:[
    {label:'NeetCode — Arrays & Hashing section (do Easy ones)', url:'https://neetcode.io/practice'},
    {label:'NeetCode YouTube — Two Sum walkthrough', url:'https://www.youtube.com/watch?v=KLlXCFG5TnA'}
  ]
},
{
  group:'INTERVIEW DSA',
  id:'dsa-pointers', title:'Two Pointers & Sliding Window',
  lesson:`
    <p>Second family of patterns, for problems about <b>contiguous stretches or pairs in ordered data</b>.</p>
    <p><b>Pattern 4 — Two pointers: one at each end, walk inward.</b></p>
    <p>Problem: is a string a palindrome (reads the same both ways)?</p>
    <pre><code>def is_palindrome(s):
    left, right = 0, len(s) - 1
    while left < right:
        if s[left] != s[right]:
            return False
        left += 1
        right -= 1
    return True</code></pre>
    <p>Two index variables converging. No extra memory, one pass. Used whenever comparing or pairing items from both ends of something ordered.</p>
    <p><b>Pattern 5 — Sliding window: a moving stretch over the data.</b></p>
    <p>Problem: best day to buy and sell a stock (max profit from one buy then one sell later).</p>
    <pre><code>def max_profit(prices):
    cheapest = prices[0]
    best = 0
    for price in prices[1:]:
        if price < cheapest:
            cheapest = price          # better buy day found
        else:
            best = max(best, price - cheapest)
    return best</code></pre>
    <p>You track a window between "cheapest so far" and "today," sliding forward, remembering the best result. Notice this is your old friend the accumulator — <code>best</code> accumulates the answer as the window moves.</p>
    <p><b>When to reach for these:</b> the problem mentions a sorted array, a substring, a subarray, "consecutive," or buy-low-sell-high shapes. If the data has an order that matters, think pointers or window before anything else.</p>
  `,
  practice:[
    {q:'NeetCode: solve "Valid Palindrome" (Easy) — Pattern 4, with a twist: skip non-alphanumeric characters.', hint:'Same converging pointers; add a check to skip punctuation using .isalnum().', answer:`def isPalindrome(s):
    left, right = 0, len(s) - 1
    while left < right:
        while left < right and not s[left].isalnum():
            left += 1
        while left < right and not s[right].isalnum():
            right -= 1
        if s[left].lower() != s[right].lower():
            return False
        left += 1
        right -= 1
    return True`},
    {q:'NeetCode: solve "Best Time to Buy and Sell Stock" (Easy) — Pattern 5 verbatim.', hint:'Track cheapest so far and best profit so far.', answer:`def maxProfit(prices):
    cheapest = prices[0]
    best = 0
    for price in prices[1:]:
        if price < cheapest:
            cheapest = price
        else:
            best = max(best, price - cheapest)
    return best`},
    {q:'On paper, no code: for the list [7,1,5,3,6,4], trace max_profit by hand — write cheapest and best after each step.', hint:'cheapest: 7,1,1,1,1,1 — best: 0,0,4,4,5,5', answer:`price=7: cheapest=7, best=0
price=1: cheapest=1, best=0
price=5: cheapest=1, best=4
price=3: cheapest=1, best=4
price=6: cheapest=1, best=5
price=4: cheapest=1, best=5
Answer: 5 (buy at 1, sell at 6)`}
  ],
  quiz:[
    {q:'What signals in a problem suggest two pointers?', a:'Sorted/ordered data, comparing from both ends, pairs in an ordered array'},
    {q:'What signals suggest a sliding window?', a:'Substring, subarray, consecutive elements, best stretch over ordered data'},
    {q:'In max_profit, what pattern is the best variable an example of?', a:'An accumulator — it accumulates the best answer seen so far as the loop advances'}

{
  group:'INTERVIEW DSA',
  id:'dsa-stack', title:'Stacks & Queues',
  lesson:`
    <p><b>Pattern 6 — Stack: last in, first out.</b> Like a stack of plates — you can only take the top one. In Python, a plain list works: <code>append()</code> to push on top, <code>pop()</code> to take the top off.</p>
    <p>The classic use: <b>matching things that open and close</b>. Problem: is a string of brackets valid — every opener closed in the right order?</p>
    <pre><code>def is_valid(s):
    stack = []
    pairs = {')': '(', ']': '[', '}': '{'}
    for ch in s:
        if ch in '([{':
            stack.append(ch)          # opener: remember it
        else:
            if not stack or stack.pop() != pairs[ch]:
                return False          # closer with no matching opener
    return len(stack) == 0            # everything got closed</code></pre>
    <p>Trace "([])": push ( , push [ , then ] pops [ (match), then ) pops ( (match), stack empty \u2192 valid. Trace "(]": push ( , then ] pops ( — mismatch \u2192 invalid.</p>
    <p><b>Queue: first in, first out</b> — like a line at a counter. Python gives you <code>collections.deque</code> with <code>append()</code> and <code>popleft()</code>. Queues power breadth-first traversal (processing things level by level), which appears in tree and graph questions at the medium level — for screening rounds, knowing what a queue is and when it applies is sufficient.</p>
    <p><b>When to reach for a stack:</b> the problem involves nesting, matching open/close pairs, undo behavior, or "most recent thing first." Brackets, parsing, browser-back-button shapes.</p>
  `,

Empty at end: valid`},

actions.append("typed hello")

{
  group:'INTERVIEW DSA',
  id:'dsa-binsearch', title:'Binary Search & Interview Strategy',
  lesson:`
    <p><b>Pattern 7 — Binary search: cut the problem in half every step.</b></p>
    <p>Finding a value in a <i>sorted</i> list: check the middle. Too small? The answer lives in the right half. Too big? Left half. Repeat. A million items takes about 20 checks instead of a million — O(log n).</p>
    <pre><code>def binary_search(nums, target):
    left, right = 0, len(nums) - 1
    while left <= right:
        mid = (left + right) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1   # not found</code></pre>
    <p>You already use this instinct — it is exactly how you narrow down a fault: rule out half the system, then half of what remains. Same idea, formalized.</p>
    <p><b>The interview strategy that matters more than any pattern:</b></p>
    <ul>
      <li><b>Talk before you code.</b> Restate the problem, ask about edge cases (empty input? duplicates?), state your approach and its complexity, THEN write. Silent coding is the number one interview mistake.</li>
      <li><b>Start with the honest brute force.</b> Saying "the naive way is nested loops, O(n\u00B2) — but a dict gets it to O(n)" scores better than jumping to the clever answer, because it shows reasoning.</li>
      <li><b>Test out loud at the end.</b> Walk one small example through your code line by line — catching your own bug live is a strong positive signal, not a weakness.</li>
    </ul>
    <p><b>Your realistic target:</b> roughly 25-30 Easy problems across these four modules of patterns, then 5-10 Mediums. That is genuinely enough for Applied AI / LLMOps screening rounds — these roles test coding fluency, not competitive algorithms. You do not need trees, graphs, or dynamic programming mastery for this path; if a specific company asks for more, prep that company specifically.</p>
  `,

{
  group:'ADVANCED PYTHON',
  id:'generators', title:'Generators & yield',
  lesson:`
    <p>A function containing <b>yield</b> becomes a <b>generator</b>. Calling it does not run the code — it creates a paused, ready-to-run generator object that remembers exactly where it left off.</p>
    <pre><code>def cumulative_average(numbers):
    total = 0
    for items, number in enumerate(numbers, 1):
        total += number
        yield total / items

values = [5, 3, 8, 2, 5]
for cum_average in cumulative_average(values):
    print(round(cum_average, 2))
# 5.0  4.0  5.33  4.5  4.6</code></pre>
    <p><b>The data flow, precisely:</b></p>
    <ul>
      <li>The function is called ONCE. What happens 5 times is next() — the outer for loop secretly calls it each iteration.</li>
      <li>Each next() resumes the generator from where it paused, runs until the next yield, hands that value out, and freezes again — with total, the loop position, and enumerate\u2019s internal tracker all preserved.</li>
      <li>enumerate(numbers, 1) pairs each item with a position counter starting at 1: (1,5), (2,3), (3,8)...</li>
    </ul>
    <p><b>yield vs return:</b> return ends the function permanently and gives back one value; local variables are destroyed. yield pauses the function, gives back one value, and keeps all local state alive for the next resume. return = handing over a finished report and closing the office. yield = handing over one page and holding the door open.</p>
    <p><b>Why generators exist:</b> for huge or streaming data, a normal function must build the entire result in memory before returning. A generator emits one result at a time, holding only what it needs to continue (here, just total). Process one item, emit one result, forget the rest.</p>
    <p><b>Producer vs consumer:</b> the generator produces values; the for loop only consumes them. The loop has no idea total even exists.</p>
  `,
  practice:[
    {q:'Write a generator countdown(n) that yields n, n-1, ... down to 1.', hint:'while n > 0: yield n; n -= 1', answer:`def countdown(n):
    while n > 0:
        yield n
        n -= 1

for x in countdown(3):
    print(x)   # 3 2 1`},
    {q:'Write a generator running_max(numbers) that yields the largest value seen so far after each item.', hint:'Keep a best variable, update with max, yield it each round.', answer:`def running_max(numbers):
    best = None
    for n in numbers:
        if best is None or n > best:
            best = n
        yield best

print(list(running_max([3, 1, 5, 2, 8])))
# [3, 3, 5, 5, 8]`},
    {q:'On paper: trace cumulative_average([10, 20]) by hand — write total, items, and the yielded value for each round.', hint:'Round 1: total 10, yields 10.0. Round 2: total 30, yields 15.0.', answer:`Round 1: enumerate gives (1, 10)
  total = 0 + 10 = 10
  yields 10/1 = 10.0, freezes
Round 2: enumerate gives (2, 20)
  total = 10 + 20 = 30
  yields 30/2 = 15.0, freezes
List exhausted, generator ends`}
  ],
  quiz:[
    {q:'How many times is a generator function called when its output is looped over 5 times?', a:'Once. The loop calls next() 5 times on the same generator object'},
    {q:'What survives between yields that does not survive a return?', a:'All local variables and loop positions — the full frozen state of the function'},
    {q:'When are generators the right tool?', a:'Large or streaming data where you want one result at a time without holding everything in memory'}
  ],
  links:[
    {label:'Real Python — introduction to generators', url:'https://realpython.com/introduction-to-python-generators/'},
    {label:'Official docs — yield expressions', url:'https://docs.python.org/3/reference/expressions.html#yield-expressions'}
  ]
},
{
  group:'ADVANCED PYTHON',
  id:'closures', title:'Closures',
  lesson:`
    <p>A <b>closure</b> is when an inner function remembers a variable from the outer function it was created in — even after the outer function has finished running.</p>
    <pre><code>def generate_power(exponent):
    def power(base):
        return base**exponent
    return power

square = generate_power(2)
print(square(4))   # 16
print(square(6))   # 36

cube = generate_power(3)
print(cube(3))     # 27</code></pre>
    <p><b>What actually happens:</b> generate_power(2) runs fully and returns the power function itself (as an object, not a result). Normally exponent would be destroyed when the outer function ends — but power still needs it, so Python keeps exponent = 2 alive in a private pocket attached to that specific function. That attached memory is the closure.</p>
    <p><b>Independence:</b> cube = generate_power(3) is a NEW call, creating a NEW power function with its OWN frozen exponent = 3. square and cube never share or interfere.</p>
    <p><b>Mental model:</b> generate_power is a factory. Each call builds a fresh function and welds one specific value permanently inside before handing it over. Same blueprint, different welded-in number, different behavior forever.</p>
    <p><b>Closure vs generator:</b> both are frozen memory across calls. A generator pauses MID-execution and resumes later. A closure has FINISHED executing but keeps specific variables alive purely for the function it returned.</p>
  `,
  practice:[
    {q:'Write make_greeter(greeting) that returns a function taking a name and returning the greeting plus the name.', hint:'Same factory shape as generate_power.', answer:`def make_greeter(greeting):
    def greet(name):
        return greeting + ", " + name
    return greet

hello = make_greeter("Hello")
namaste = make_greeter("Namaste")
print(hello("Anu"))     # Hello, Anu
print(namaste("Anu"))   # Namaste, Anu`},
    {q:'Write make_counter() that returns a function which returns 1, then 2, then 3 on each call.', hint:'Keep count in the outer function; use nonlocal count in the inner one to modify it.', answer:`def make_counter():
    count = 0
    def counter():
        nonlocal count
        count += 1
        return count
    return counter

c = make_counter()
print(c(), c(), c())   # 1 2 3`},
    {q:'Predict without running: a = make_counter(); b = make_counter(); a(); a(); print(b()). What prints and why?', hint:'Each factory call gets its own frozen count.', answer:`Prints 1.
a and b are separate closures with separate
count variables. Calling a() twice only
advances a\u2019s count. b\u2019s count is untouched.`}
  ],
  quiz:[
    {q:'What is a closure in one sentence?', a:'An inner function that keeps access to variables from its outer function even after the outer function has finished'},
    {q:'Do two functions from the same factory share their remembered variables?', a:'No — each call to the factory creates an independent closure with its own frozen values'},
    {q:'What keyword lets an inner function MODIFY (not just read) an outer variable?', a:'nonlocal'}
  ],
  links:[
    {label:'Real Python — closures explained', url:'https://realpython.com/python-closure/'},
    {label:'Official docs — naming and binding', url:'https://docs.python.org/3/reference/executionmodel.html'}
  ]
},
{
  group:'ADVANCED PYTHON',
  id:'asyncio', title:'Async & asyncio',
  lesson:`
    <p><b>asyncio</b> lets one program juggle many slow, waiting tasks at once — network calls, API requests, file reads. It is the tool when the bottleneck is WAITING, not computation.</p>
    <pre><code>import asyncio

async def fetch_data(name, delay):
    print(name, "started")
    await asyncio.sleep(delay)   # stands in for a slow API call
    print(name, "finished")
    return name + " result"

async def main():
    results = await asyncio.gather(
        fetch_data("API 1", 2),
        fetch_data("API 2", 2),
        fetch_data("API 3", 2)
    )
    print(results)

asyncio.run(main())</code></pre>
    <p><b>Output shape:</b> all three "started" lines print immediately in a burst (each coroutine runs until its first await, then pauses). The "finished" lines arrive ~2 seconds later in UNPREDICTABLE order — all three became ready at nearly the same instant, and the event loop resumes them in whatever order it happens to. Total time: ~2 seconds, not 6, because the waiting overlaps.</p>
    <p><b>One guarantee:</b> gather always returns results in the order you PASSED the coroutines, regardless of finish order.</p>
    <p><b>Mapping to what you know:</b></p>
    <ul>
      <li>async def function \u2192 like a generator: calling it creates a paused coroutine object, nothing runs</li>
      <li>await \u2192 like yield: a pause point that freezes local state and hands control back</li>
      <li>The event loop \u2192 like the for loop calling next(), except it juggles MANY coroutines and resumes whichever is ready</li>
    </ul>
    <p><b>The one real difference from generators:</b> a generator resumes only when YOU call next(), so order is fully predictable. Coroutines resume when the event loop decides — finish order is a race. Same spirit as a race condition in production, in miniature.</p>
    <p><b>Why it matters for AI work:</b> calling an LLM API is exactly this kind of slow waiting operation. A RAG system calling an embedding API, a retrieval store, and an LLM should overlap those waits — a common LLMOps interview topic.</p>
  `,
  practice:[
    {q:'Run the example above locally. Then change the three delays to 1, 2, 3 and predict the finished order before running.', hint:'With different delays the finish order becomes predictable: shortest first.', answer:`API 1 finished (after 1s)
API 2 finished (after 2s)
API 3 finished (after 3s)
Results list is still in passed order:
["API 1 result", "API 2 result", "API 3 result"]`},
    {q:'Time it: wrap the gather version and a sequential version (await each fetch one by one) with time.time() and compare totals.', hint:'Sequential should take ~6s, gather ~3s with delays 1,2,3.', answer:`import time
start = time.time()
asyncio.run(main())
print(round(time.time() - start, 1))
# gather: ~3.0   sequential: ~6.0`},
    {q:'In words: why does asyncio NOT speed up a heavy pure-math computation?', hint:'What is the bottleneck asyncio addresses?', answer:`asyncio only overlaps WAITING time.
A pure computation never waits — there is
nothing to overlap. It needs the CPU the
whole time, so juggling does not help.
(That case needs multiprocessing instead.)`}
  ],
  quiz:[
    {q:'What kind of bottleneck does asyncio solve?', a:'Waiting (I/O) — network calls, APIs, disk. Not heavy computation'},
    {q:'What is await most similar to, from earlier lessons?', a:'yield — a pause point that freezes state and hands control back'},
    {q:'Is the finish order of gathered coroutines with equal delays guaranteed?', a:'No — but the results list order always matches the order they were passed in'}
  ],
  links:[
    {label:'Real Python — async IO walkthrough', url:'https://realpython.com/async-io-python/'},
    {label:'Official docs — asyncio', url:'https://docs.python.org/3/library/asyncio.html'}
  ]
},
{
  group:'PORTFOLIO PROJECTS',
  id:'project-rag', title:'Guided Project: RAG Troubleshooting Assistant',
  lesson:`
    <p>This is the guided project — the scope is given; the code is yours. It deliberately weaponizes your background: a system that answers "why did this error happen" from past ticket knowledge, which is literally the tool your Dell team never had.</p>
    <p><b>Locked scope (v1):</b></p>
    <ul>
      <li><b>Does one thing:</b> given a text description of an error or issue, return the most similar past tickets plus a generated explanation of likely cause and fix.</li>
      <li><b>Input:</b> one text description typed by the user.</li>
      <li><b>Output:</b> top matching past ticket(s) and an LLM-written summary of probable cause and suggested fix, grounded in those tickets.</li>
      <li><b>Data:</b> a JSON file of 15-20 realistic tickets YOU write — issue, root cause, fix, notes. Base them on anonymized patterns from your own experience; never real customer data, names, or logs.</li>
      <li><b>Out of scope for v1:</b> live ticket integration, fine-tuning, multi-turn chat, authentication. Naming what you are NOT building is what makes v1 finishable.</li>
    </ul>
    <p><b>Build order — each step is a Git commit:</b></p>
    <ol>
      <li>Repo + README stub + the tickets JSON file. Commit.</li>
      <li>Load and print all tickets (File I/O + JSON practice pays off here). Commit.</li>
      <li>Basic retrieval WITHOUT AI first: match by shared keywords between the query and each ticket, return top 3. Commit. This proves the pipeline shape before any AI enters.</li>
      <li>Upgrade retrieval to embeddings: use a library like sentence-transformers to embed tickets and query, rank by similarity. Commit.</li>
      <li>Add the generation step: send the query + top tickets to an LLM API, prompt it to explain likely cause and fix USING ONLY the retrieved tickets. Commit.</li>
      <li>Wrap in a simple interface — a command line loop is fine; a small Streamlit page is nicer. Commit.</li>
      <li>Write 4-5 pytest tests (retrieval returns expected ticket for a known query, empty query handled, malformed JSON handled). Commit.</li>
      <li>Deploy to Hugging Face Spaces (no Docker/WSL needed). Final commit + README with a screenshot and an RCA-style writeup: what broke while building, how you debugged it.</li>
    </ol>
    <p><b>The README matters as much as the code.</b> Structure it like one of your RCAs: problem, approach, what went wrong during the build, resolution, what v2 would add. That writeup IS your interview story.</p>
  `,

{
  group:'CAREER',
  id:'repositioning', title:'Repositioning: Resume, LinkedIn, Targets',
  lesson:`
    <p>Month 5 is packaging. The work exists — now it has to read correctly in 30 seconds, because that is how long a screener looks.</p>
    <p><b>Resume framing — the one rule:</b> you are NOT "new to AI." You are a senior engineer (9-12 years) with deep production troubleshooting experience who has added an AI systems specialization. Every line should support that sentence.</p>
    <ul>
      <li>Headline shape: Senior Software Engineer \u00B7 Production Systems + Applied AI / LLMOps</li>
      <li>Lead with the Dell experience reframed around transferable strengths: RCA on complex production systems, customer-facing escalations, working in undocumented codebases</li>
      <li>Projects get their own section with live links: what it does, stack, one line on the hardest problem solved</li>
      <li>Skills section mirrors job-posting language: Python, RAG, LLM APIs, embeddings, pytest, SQL, Git, monitoring/evaluation</li>
      <li>Never write "learning" or "beginner" anywhere. The projects are evidence of DOING.</li>
    </ul>
    <p><b>LinkedIn profile rebuild (safe while employed):</b></p>
    <ul>
      <li>Headline and About can emphasize production + AI systems interest without any pivot language — no "seeking," "open to," or "excited for next chapter" while not ready</li>
      <li>Turn ON the recruiter-only "Open to Work" setting (visible to recruiters, hidden from your company) — never the public green banner</li>
      <li>Featured section: pin both project repos/demos</li>
      <li>Posting, if any: pure learning/building content, no dissatisfaction, no company mentions. A post about a project is a build story, not an announcement.</li>
    </ul>
    <p><b>Target list — three buckets:</b></p>
    <ul>
      <li><b>GCCs</b> (global capability centers in India: the India arms of large US/EU product and finance companies) — the single biggest comp jump lever from a services-style employer</li>
      <li><b>Product companies</b> — Indian and international, including remote-for-US roles</li>
      <li><b>Indian AI-mission startups</b> — foundation-model and applied-AI companies funded under the IndiaAI push (check current names when you get here; they change). Higher risk, highest learning density.</li>
    </ul>
    <p><b>Outreach that works:</b> 10 warm, specific messages beat 100 generic ones. Shape: one line of genuine specific interest in their work, one line of what you bring (production + AI projects, with link), one soft ask (open to a short chat, or who is the right person to talk to). Never "any openings?"</p>
  `,

{
  group:'CAREER',
  id:'interviews', title:'Interviews & Negotiation',
  lesson:`
    <p>The portfolio gets you in the room. This module is what happens in the room.</p>
    <p><b>Project storytelling — the 3-minute arc.</b> For each project, be able to deliver, out loud, without notes:</p>
    <ol>
      <li><b>Problem</b> (30s): what gap it fills, why you picked it — tie to your escalation background</li>
      <li><b>Approach</b> (60s): the architecture in plain words, one key design decision and its tradeoff</li>
      <li><b>The hard part</b> (60s): what broke, how you debugged it — your strongest material; tell it like an RCA</li>
      <li><b>Result + next</b> (30s): what works today, what v2 would add</li>
    </ol>
    <p>Practice by recording yourself on your phone. Listen back once per project. Two rounds of this beats ten silent rehearsals.</p>
    <p><b>Answering "why are you moving?"</b> Never negativity about the current role. The honest positive version: spent years diagnosing production systems, want to BUILD them, and AI systems are where diagnostic skill plus building meet. One sentence, then stop talking.</p>
    <p><b>The screening-round shape at product companies:</b> typically recruiter chat \u2192 coding screen (your DSA prep) \u2192 technical deep-dive (your projects + fundamentals) \u2192 system/behavioral rounds. The DSA section covers round 2; this module and your READMEs cover round 3.</p>
    <p><b>Negotiation — the anchoring rule:</b></p>
    <ul>
      <li>State the target in the FIRST recruiter call, framed as fixed: looking at total fixed compensation of X, no variable component. Early anchoring filters out companies that can never reach it — that is time saved, not opportunity lost.</li>
      <li>Never share current comp as the basis; state the expectation, not the history. If pressed: prefer to focus on the target for this role.</li>
      <li>Multiple processes running in parallel is the only real leverage. Sequence interviews so offers can land close together.</li>
      <li>Get every number in writing before resigning. Verbal offers are not offers.</li>
    </ul>
    <p><b>Resignation, when it comes:</b> standard notice, no bridges burned, no pivot story owed to anyone. The years of goodwill at Dell are an asset — references and boomerang options are real.</p>
  `,
  practice:[
    {q:'Write the 4-part story arc for the RAG project as bullet notes, then record yourself delivering it in under 3 minutes.', hint:'The "hard part" section should be your longest and most specific.'},
    {q:'Write your one-sentence "why are you moving" answer and say it out loud until it sounds natural, not rehearsed.', hint:'Diagnose to build. One sentence. Stop talking after it.'},
    {q:'Roleplay the comp anchor: say the fixed-comp expectation sentence out loud as if to a recruiter, including handling "what is your current CTC?"', hint:'Prefer to focus on the target for this role — said calmly, once.'}
  ],
  quiz:[
    {q:'What is your strongest storytelling material in any technical interview?', a:'What broke and how you debugged it — told like an RCA'},
    {q:'When do you state the fixed-comp expectation?', a:'In the first recruiter call — early anchoring filters out companies that can never reach it'},
    {q:'What is the only real negotiation leverage?', a:'Multiple parallel processes with offers landing close together'}
  ],
  links:[
    {label:'STAR method for behavioral answers', url:'https://www.themuse.com/advice/star-interview-method'},
    {label:'levels.fyi — India comp data for calibration', url:'https://www.levels.fyi/'}
  ]
},
{
  group:'FLUENCY',
  id:'rebuild', title:'Rebuild From Scratch (the core drill)',
  lesson:`
    <p><b>The gap this fixes:</b> you can read code and follow what it does, but cannot write it from a blank file. That is not a knowledge problem — it is a reps problem, and reading more lessons will not fix it. Only writing unaided will.</p>
    <p><b>The drill:</b> rebuild the PDF reader RAG system from an empty file. Same features. Your own code. No copy-paste from the old version.</p>
    <p><b>Rules that make it work:</b></p>
    <ul>
      <li>Old file closed. Open it only when genuinely stuck for more than 15 minutes — and when you do, read the concept, close it again, then write your own version.</li>
      <li>Library docs are allowed and encouraged. Looking up how chromadb.create_collection works is normal engineering. Copying your own old solution is not.</li>
      <li>Type every line. No pasting, even from docs.</li>
      <li>Build it in the same order you would explain it: load → chunk → embed → index → retrieve → generate → memory → citations.</li>
    </ul>
    <p><b>Why this matters more than a new project:</b> the RAG system is already on your CV and already deployed. Right now those bullets describe decisions you did not make. After this rebuild they describe decisions you did. Same artifact, now defensible under questioning.</p>
    <p><b>The questions you must be able to answer cold when done:</b></p>
    <ul>
      <li>Why chunk at all? What breaks if you send the whole document?</li>
      <li>Why overlap between chunks? What is lost without it?</li>
      <li>What does an embedding actually represent, and why does similarity work?</li>
      <li>Why a rolling window on history instead of keeping everything?</li>
      <li>Why rewrite the query before retrieval? Give a concrete failing example without it.</li>
      <li>How does the system avoid making things up, and how would you test that it works?</li>
    </ul>
    <p>If you cannot answer one of these, that is the part to rebuild most carefully.</p>
  `,
  practice:[
    {q:'Session 1: from a blank file, write load_pdf and chunk_text yourself. Test chunk_text on a short string and verify the overlap is actually there.', hint:'Print the last 20 chars of chunk N and first 20 of chunk N+1 — they should share text.'},
    {q:'Session 2: embeddings + vector store + retrieval. Query it with a question and print the retrieved chunks BEFORE adding any LLM call.', hint:'Retrieval quality is the whole game — see it working on its own first.'},
    {q:'Session 3: add the LLM call with strict grounding. Deliberately ask something not in the document and confirm it declines instead of inventing.', hint:'This is your hallucination test — it belongs in the README.'},
    {q:'Session 4: add conversational memory and query rewriting. Write down, in one sentence each, WHY each exists.', hint:'If you cannot justify it in a sentence, you have copied it rather than understood it.'},
    {q:'Final: answer all six cold questions from the lesson out loud, recorded. Listen back once.', hint:'Any hesitation marks the section to revisit.'}
  ],
  quiz:[
    {q:'When is looking at documentation fine, and when is it defeating the drill?', a:'Library docs are fine — that is normal engineering. Copying your own previous solution defeats the purpose'},
    {q:'What makes the second build valuable when the first one already works?', a:'The first build outsourced the decisions; the second one makes them yours, so the CV bullets become defensible'},
    {q:'What is the test for whether a feature is understood rather than copied?', a:'Being able to justify why it exists in one sentence, and describe what breaks without it'}
  ],
  links:[
    {label:'ChromaDB docs', url:'https://docs.trychroma.com/'},
    {label:'sentence-transformers docs', url:'https://www.sbert.net/'},
    {label:'Groq API docs', url:'https://console.groq.com/docs/quickstart'}
  ]
},
{
  group:'FLUENCY',
  id:'architecture', title:'Architecture Reps',
  lesson:`
    <p><b>The gap this fixes:</b> being handed a problem and freezing on structure. This is not a talent you lack — it is a skill with very few reps behind it. Ten short reps and the freeze goes.</p>
    <p><b>The drill: ten minutes, on paper, no code.</b> For each problem below, write only:</p>
    <ol>
      <li><b>The nouns</b> — what things exist in this problem? (These become your classes, tables, or data structures.)</li>
      <li><b>The verbs</b> — what happens to those things? (These become your functions.)</li>
      <li><b>What is stored</b>, and where does it live between runs?</li>
      <li><b>One decision and its tradeoff</b> — anything you had to choose between.</li>
      <li><b>Out of scope</b> — what you are deliberately not building.</li>
    </ol>
    <p>That is the whole exercise. No code, no perfection, ten minutes, then move on. Doing ten mediocre reps beats agonising over one perfect design.</p>
    <p><b>The nouns-and-verbs trick is the actual method.</b> Read the problem statement and underline every noun: for a parking lot — parking lot, level, spot, vehicle, ticket, payment. Those are your entities. Then the verbs: park, leave, calculate fee, find free spot. Those are your operations. Structure falls out of the language of the problem, which is why staring at a blank page feels impossible and reading the problem sentence by sentence does not.</p>
    <p><b>The rule you already discovered yourself:</b> one thing, one job. When you noticed ExpenseTracker was trying to be both "one expense" and "the whole system," you found the single responsibility principle without being taught it. Apply that test to every box you draw.</p>
    <p><b>The second test:</b> which parts can be tested by passing arguments and checking a return value? Push logic into those. Anything that talks to a screen, a keyboard, a file, or a network gets its own thin layer.</p>
  `,
  practice:[
    {q:'Rep 1-3: design a URL shortener, a library book lending system, and a parking lot. Ten minutes each, paper only.', hint:'Nouns first, then verbs. Do not code any of them.'},
    {q:'Rep 4-6: design a food delivery order flow, a hotel booking system, and a simple chat application.', hint:'Notice the shapes repeating across problems — that repetition is the skill forming.'},
    {q:'Rep 7-10: design a rate limiter, an ATM, a movie ticket booking system, and a to-do app with reminders.', hint:'By now the freeze should be gone. Speed matters more than elegance.'},
    {q:'After ten reps: go back to the Expense Tracker and design it again in ten minutes. Compare with your first attempt.', hint:'The point is seeing your own improvement, not producing a better tracker.'}
  ],
  quiz:[
    {q:'What is the quickest way to find candidate classes in a problem statement?', a:'Underline the nouns — entities are usually named directly in the problem'},
    {q:'What test tells you a class is doing too much?', a:'If it represents both one item and the system managing many items, it has two jobs and should be split'},
    {q:'Why is ten mediocre reps better than one perfect design?', a:'The freeze comes from lack of repetition, not lack of quality — volume removes it'}
  ],
  links:[
    {label:'Refactoring Guru — UML class diagrams', url:'https://refactoring.guru/uml-class-diagram'},
    {label:'Refactoring Guru — design patterns catalogue', url:'https://refactoring.guru/design-patterns/catalog'}
  ]
},
{
  group:'AI ENGINEERING',
  id:'agentic', title:'Agentic AI & Tool Calling',
  lesson:`
    <p>"Agentic AI" appears in nearly every JD you are seeing, so it is worth being precise about what it means. An <b>agent</b> is a system where the LLM decides which tools to call, in what order, using the results to decide what to do next — rather than just answering in one shot.</p>
    <p>You have already tested one in production at work. What you have not done is build one. That is the gap this closes, and it is the natural next project after the rebuild.</p>
    <p><b>The mechanism, which you already recorded in your own notes:</b></p>
    <ul>
      <li>The LLM cannot run code. It <i>decides</i> which function to call and with what arguments; your script executes it.</li>
      <li>You pass a <b>tools list</b> — descriptions of available functions so the model knows what exists and when to use each.</li>
      <li>The model returns <b>tool calls</b>: which function, which parameters.</li>
      <li>Your code runs it, appends the result to the message history, and calls the model again — the model now sees the result and decides the next step.</li>
      <li>That loop, repeated until the model stops requesting tools, is the entire agent.</li>
    </ul>
    <p><b>ReAct</b> (Reason + Act) is the standard pattern name: the model alternates between reasoning about what to do and taking an action, using each observation to inform the next step. Your day-9 note said "need to understand" — this is it.</p>
    <p><b>What makes agents hard in production</b> (and what interviewers probe): they loop forever, call the wrong tool, misread results, or take expensive paths. Guardrails matter — maximum iteration counts, timeouts, validating tool outputs before feeding them back, and logging every step so failures can be traced. This is exactly the evaluation lens you already apply at work, which is why you can speak about it credibly.</p>
    <p><b>Suggested build:</b> an agent that answers questions about your own machine or a small dataset — with 3-4 tools (search files, read a file, run a calculation, query a database). Small scope, real loop, full logging.</p>
  `,
  practice:[
    {q:'Reread your own day-5 notes on tool calling, then build a single-tool agent from scratch: one function the model can choose to call.', hint:'Start with something trivial like get_current_time so the loop is the only new thing.'},
    {q:'Expand to 3-4 tools and add a max-iterations guard so it cannot loop forever.', hint:'A while loop with a counter, breaking when the model stops requesting tools or the cap is hit.'},
    {q:'Add step logging: print every reasoning step, tool call, and result. Then deliberately give it a question needing two tools in sequence and watch the trace.', hint:'This trace is your interview demo — it shows the loop working, not just the answer.'},
    {q:'Break it on purpose: make a tool return garbage, and see how the agent responds. Add handling.', hint:'Failure behaviour is what production readiness actually means.'}
  ],
  quiz:[
    {q:'Does the LLM execute the tool itself?', a:'No — it decides which function and which arguments; your code executes it and passes the result back'},
    {q:'What is the ReAct pattern?', a:'Alternating reasoning and acting — the model reasons about what to do, acts via a tool, observes the result, and repeats'},
    {q:'Name two guardrails an agent needs in production.', a:'Maximum iteration limits and validation of tool outputs; also timeouts and step logging for traceability'}
  ],
  links:[
    {label:'Groq — tool use documentation', url:'https://console.groq.com/docs/tool-use'},
    {label:'Anthropic — tool use guide', url:'https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview'},
    {label:'ReAct paper (original)', url:'https://arxiv.org/abs/2210.03629'}
  ]
},
{
  group:'AI ENGINEERING',
  id:'cloud', title:'Cloud Fundamentals',
  lesson:`
    <p>Cloud appears in essentially every backend and AI engineering JD, and you currently have none of it. Treat this as a <b>checkbox gap</b>: it blocks you at the filtering stage more than in interviews, so the goal is working familiarity, not certification.</p>
    <p><b>Pick ONE provider.</b> AWS has the largest market share and the most job postings; GCP is common at AI-forward companies. Either is fine — the concepts transfer. Do not learn two.</p>
    <p><b>The five things that actually matter for your roles:</b></p>
    <ul>
      <li><b>Compute</b> — where your code runs. A virtual machine (EC2 on AWS) is a rented server. Serverless functions (Lambda) run your code on demand without managing a server at all.</li>
      <li><b>Storage</b> — object storage (S3) holds files: documents, model artifacts, logs. Nearly every AI pipeline reads from and writes to it.</li>
      <li><b>Databases</b> — managed SQL (RDS) means the provider handles backups, patching, and availability instead of you.</li>
      <li><b>Identity and access (IAM)</b> — who and what is allowed to do what. This is where most real-world cloud mistakes and security incidents happen.</li>
      <li><b>Networking basics</b> — how services reach each other and what is exposed publicly. Enough to reason about why something cannot connect.</li>
    </ul>
    <p><b>The AI-specific layer</b>, once the above is comfortable: managed model endpoints (AWS Bedrock, GCP Vertex AI), and where vector databases live in a deployed architecture.</p>
    <p><b>The honest scope:</b> deploy one small thing end to end, and you can speak about cloud credibly. That is worth more than a half-finished certification course, and it takes a weekend rather than a month.</p>
  `,
  practice:[
    {q:'Create a free-tier account on AWS or GCP. Set a billing alert immediately, before anything else.', hint:'Billing alerts prevent the classic accidental-charges story. Do this first, every time.'},
    {q:'Upload a file to object storage (S3 or GCS) from the console, then do the same from Python using the provider SDK.', hint:'boto3 for AWS, google-cloud-storage for GCP.'},
    {q:'Deploy your rebuilt RAG app to a cloud service rather than Streamlit Cloud — even a single small VM counts.', hint:'This turns a checkbox gap into a real portfolio line.'},
    {q:'Write one paragraph explaining your deployed architecture: what runs where, what stores what, what is public.', hint:'This paragraph is your answer when an interviewer asks about your cloud experience.'}
  ],
  quiz:[
    {q:'What is object storage typically used for in an AI pipeline?', a:'Holding files — source documents, model artifacts, logs — that the pipeline reads from and writes to'},
    {q:'What does IAM govern, and why does it matter?', a:'Who and what is permitted to do what; most real-world cloud security incidents trace back to it'},
    {q:'What is the minimum that makes cloud experience credible on a CV?', a:'One small thing actually deployed end to end, with the ability to explain what runs where'}
  ],
  links:[
    {label:'AWS — free tier and getting started', url:'https://aws.amazon.com/free/'},
    {label:'Google Cloud — free tier', url:'https://cloud.google.com/free'},
    {label:'AWS Bedrock overview', url:'https://aws.amazon.com/bedrock/'}
  ]
},
{
  group:'CAREER',
  id:'applying', title:'Applying: Daily Loop & JD Triage',
  lesson:`
    <p>You are applying 2-5 per day. That volume only pays off with a filter, otherwise it becomes noise that generates rejections and drains morale.</p>
    <p><b>Triage every JD into one of three buckets:</b></p>
    <ul>
      <li><b>Apply now</b> — Python-first, AI/LLM central to the role, backend or applied AI. Your CV already speaks to these.</li>
      <li><b>Apply with a note of what to learn</b> — good fit but names one gap (cloud, a specific framework). Apply anyway; log the gap.</li>
      <li><b>Skip</b> — TypeScript/Node/full-stack-first roles, or anything where AI is incidental. Chasing a new language now fragments you badly and you will lose weeks.</li>
    </ul>
    <p><b>Keep a JD gap log.</b> One line per application: company, role, and any skill named that you do not have. After 20 applications the pattern is unmistakable, and it tells you what to learn next far better than any curriculum. Your own instinct here was right — this is better signal than a plan written months ago.</p>
    <p><b>Expect the timeline to be slow.</b> Applications take weeks to convert to first calls. That is normal and not a signal about your profile. Applying from a stable job is a genuine advantage: you can hold out for the number you actually want, and you never have to accept something out of urgency.</p>
    <p><b>Before the first interview lands, two things must be true:</b> the RAG rebuild is done (so your CV bullets are defensible), and you can tell the project story out loud in under three minutes. Coding screens come fast — usually within a week or two of a recruiter call.</p>
    <p><b>On the number:</b> your position is that leaving a stable ₹32L for ₹42L is a worse deal per hour, and only a near-double justifies the move. That is sound, and worth stating early in recruiter calls so neither side wastes time. Relocation changes the maths — compare net income against local cost of living and what public services actually deliver, not the raw converted figure.</p>
  `,
  practice:[
    {q:'Start the JD gap log today — a simple sheet: date, company, role, skills named that you lack.', hint:'One line per application. Review it every 20 applications.'},
    {q:'Review your last 10 applications and categorise each into the three buckets. Notice how many were skips you should not have sent.', hint:'Precision beats volume once the filter is working.'},
    {q:'Write your fixed-comp expectation sentence and use it in the first recruiter call, not at offer stage.', hint:'Early anchoring filters out companies that can never reach your number.'}
  ],
  quiz:[
    {q:'Which JDs should you skip outright?', a:'TypeScript/Node/full-stack-first roles, and anything where AI is incidental — chasing a new language now fragments your focus'},
    {q:'What does the JD gap log give you that a curriculum cannot?', a:'Real market signal about which skills actually appear in the roles you want, right now'},
    {q:'What must be true before your first technical interview?', a:'The RAG rebuild is done so your CV is defensible, and you can tell the project story out loud in under three minutes'}
  ],
  links:[
    {label:'levels.fyi — comp calibration', url:'https://www.levels.fyi/'},
    {label:'PTE Academic — book a test', url:'https://www.pearsonpte.com/'}
